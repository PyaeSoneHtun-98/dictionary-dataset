name: Polish Dictionary Batch 052 Selection
on:
  push:
    paths:
      - 'staging/batch052/POLISH'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace low-quality entries
        run: |
          python - <<'PY'
          import base64,zlib,pathlib
          root=pathlib.Path('.'); stage=root/'staging'/'batch052'
          words=[x.strip() for x in (stage/'selection.txt').read_text().splitlines() if x.strip()]
          used=set(zlib.decompress(base64.b64decode((root/'lookup'/'used_keys_current.zlib.b64').read_text().strip())).decode().splitlines())
          bad=set('preparednes phylla programing mecca medicare judaism passover mulatto junkbond machinegun mortis klieg mumbo mortified dotted undetected chateaux goldstock realtor'.split())
          reserves='sensibility couscous paella lioness goulash individuality windscreen jangle lidocaine uninhabited bathhouse catchphrase smut smithy biryani teleportation unrequited unguarded cuppa pesto duckling unhook takedown smite onslaught sashimi unregistered splendour teahouse undecided punt thumbprint dishonour refinement impertinence wasabi medevac wildebeest slink wedgie vexed tapeworm underprivileged congee windpipe'.split()
          words=[w for w in words if w not in bad]
          for w in reserves:
              if len(words)>=500: break
              if w not in used and w not in words:
                  words.append(w)
          assert len(words)==500
          assert len(set(words))==500
          assert not(set(words)&used)
          assert not(set(words)&bad)
          (stage/'selection.txt').write_text('\n'.join(words)+'\n',encoding='utf-8')
          (stage/'POLISH').unlink(missing_ok=True)
          wf=root/'.github'/'workflows'/'polish-batch052.yml'
          if wf.exists(): wf.unlink()
          print('VALID',len(words))
          PY
      - name: Commit polished selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Polish Batch 052 selection"
          git push
