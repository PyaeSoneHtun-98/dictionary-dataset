name: Select Dictionary Batch 050

on:
  push:
    paths:
      - 'staging/batch050/SELECT'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select 500 unused words
        run: |
          python - <<'PY'
          import base64, pathlib, re, urllib.request, zlib

          root = pathlib.Path('.')
          stage = root / 'staging' / 'batch050'
          stage.mkdir(parents=True, exist_ok=True)

          encoded = (root/'lookup'/'used_keys_current.zlib.b64').read_text(encoding='ascii').strip()
          used = set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())

          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return r.read().decode('utf-8')

          adj = get('https://raw.githubusercontent.com/evllabs/JGAAP/master/src/com/jgaap/resources/wordnet/index.adj')
          adv = get('https://raw.githubusercontent.com/evllabs/JGAAP/master/src/com/jgaap/resources/wordnet/index.adv')
          freq_txt = get('https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt')

          def parse(txt, pos):
              out = {}
              for line in txt.splitlines():
                  if not line or line.startswith(' '):
                      continue
                  w = line.split()[0].lower()
                  if re.fullmatch(r'[a-z]{4,16}', w):
                      out[w] = pos
              return out

          lex = parse(adj, 'adjective')
          for w,p in parse(adv, 'adverb').items():
              lex.setdefault(w,p)

          freq = {}
          for i,line in enumerate(freq_txt.splitlines(),1):
              parts=line.split()
              if parts and parts[0] not in freq:
                  freq[parts[0]]=i

          banned=set('''matt caroline julian norman dexter bush august latin dutch european scotch muslim swiss cuban flint beta mediterranean hindi hawaiian persian aryan tamil scots saxon armenian spartan latino arabian filipino tudor venetian siamese argentine dominican mongol norse bolshevik alaskan florentine westside creole chechen texan catalan neapolitan jesuit sikh athenian sumerian genovese himalayan yugoslav lutheran eastside sudanese babylonian midwestern argentinian manchurian californian olympian polynesian tuscan corsican milanese macedonian slav shona appalachian dalmatian samoan carthaginian gaussian alsatian phoenician yugoslavian columbian algonquin andean argive minoan hebraic homeric jungian rumanian hegelian cartesian newtonian jacksonian wilsonian bogartian boeotian'''.split())
          reject=set('''meet game beat pass star tops asap trig fain snafu molto viii xiii triangulate reverend sapiens braggart casebook canonist dipylon tokenish twoscore bannerlike ahorseback'''.split())

          common=[]
          pref=[]
          fallback=[]
          prefix=re.compile(r'^(un|non|in|im|ir|dis|mis|over|under|inter|intra|multi|anti|pre|post|sub|super|hyper|hypo|counter)')
          for w,pos in lex.items():
              if w in used or w in banned or w in reject or re.search(r'(ed|ing)$',w):
                  continue
              r=freq.get(w,999999)
              rec=(w,pos,r)
              if r<=12000 and not re.search(r'(er|est)$',w):
                  common.append(rec)
              elif prefix.search(w):
                  pref.append(rec)
              else:
                  fallback.append(rec)

          common.sort(key=lambda x:(x[2],x[0]))
          pref.sort(key=lambda x:((x[2] if x[2]<50000 else 60000)+len(x[0])*80,x[0]))
          fallback.sort(key=lambda x:((x[2] if x[2]<50000 else 70000)+len(x[0])*100,x[0]))

          selected=[]
          seen=set()
          for w,pos,r in common+pref+fallback:
              if w in seen: continue
              seen.add(w)
              selected.append((w,pos))
              if len(selected)==500: break

          assert len(selected)==500
          assert not ({w for w,_ in selected} & used)
          (stage/'selection.tsv').write_text(''.join(f'{w}\t{p}\n' for w,p in selected),encoding='utf-8')
          (stage/'SELECT').unlink(missing_ok=True)
          wf=root/'.github'/'workflows'/'select-batch050.yml'
          if wf.exists(): wf.unlink()
          print('selected',len(selected))
          PY

      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Freeze Batch 050 selection"
          git push
