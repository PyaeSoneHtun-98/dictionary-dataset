name: Repair Batch 034 Selection

on:
  push:
    paths:
      - 'staging/batch034/REPAIR_SELECTION'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace proper-name leaks
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          sel=root/'staging'/'batch034'/'final_selection.tsv'
          rows=[x for x in sel.read_text(encoding='utf-8').splitlines() if x.strip()]
          words=[r.split('\t',1)[0] for r in rows]
          assert len(rows)==500 and words.count('pentecost')==1 and words.count('chara')==1
          candidates={}
          for p in (root/'staging'/'batch034'/'candidates').glob('candidates_*.tsv'):
              for r in p.read_text(encoding='utf-8').splitlines():
                  if r.strip(): candidates[r.split('\t',1)[0]]=r
          repl={'pentecost':'illusory','chara':'hurriedly'}
          assert all(v in candidates for v in repl.values())
          out=[]
          for r in rows:
              w=r.split('\t',1)[0]
              out.append(candidates[repl[w]] if w in repl else r)
          words=[r.split('\t',1)[0] for r in out]
          assert len(out)==500 and len(set(words))==500
          assert 'pentecost' not in words and 'chara' not in words and 'illusory' in words and 'hurriedly' in words
          sel.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch034/final_selection.tsv
          git commit -m 'Repair Batch 034 selection'
          git push
