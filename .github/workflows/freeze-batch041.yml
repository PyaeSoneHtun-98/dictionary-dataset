name: Freeze Batch 041 Selection

on:
  push:
    paths:
      - 'staging/batch041/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch041'/'candidates'
          rows=[]
          for i in range(1,39):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,11): first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('''hittite afghani columbo thirtieth vestal bolshevism brougham londoner soonest yarder canaanite chadian corvus huguenot pilsner svoboda trappist catawba columba jacobean jacobin littler nett omani punic satanist zuni genoese gnp junker oxbridge penobscot timorese augustinian cyprian dietician energizer floridian laotian twinkie descendent jeffersonian kraut pennsylvanian risc seidel junky dervish'''.split())
          replacements='''crosstalk dross dweeb engrave equivocal ethane flighty galvanic gingham gouache griffon hallow hanky hippodrome hurdler hydrotherapy iconoclastic imperfectly incontinent infliction interject interlocutor jobber kinesiology laryngitis missive molt motherless myosin neighborly nonstandard nosedive obliteration orthodontics perversely pinstripe prolactin psychical puerile quadriceps quartile rapidity reconstitute restatement restive sameness scriptwriter swindler'''.split()
          assert len(first)==500 and len(reject)==48 and len(replacements)==48
          first_words=[r.split('\t',1)[0] for r in first]
          assert reject <= set(first_words), sorted(reject-set(first_words))
          assert all(w in parsed for w in replacements)
          assert not (set(replacements)&set(first_words))
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(kept)==452 and len(final)==500 and len(set(words))==500
          (root/'staging'/'batch041'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch041'/'SELECTION_SUMMARY.txt').write_text('retained=452\nreplacements=48\nfinal=500\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch041/final_selection.tsv staging/batch041/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 041 selection'
          git push
