name: Freeze Batch 038 Selection

on:
  push:
    paths:
      - 'staging/batch038/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch038'/'candidates'
          rows=[]
          for i in range(1,31):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,11):
              first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('''esperanto goldilocks gorgon lisle wicca angora babbitt caesarean capella ganglia jacobite jodhpur rottweiler scsi wiccan capra tyrannosaurus cates cortland gringo hansard irks anova druze elks ices mulatto pythagorean sids southerner americanism cinque hessian lally leninism moslem pees puritanical philistine'''.split())
          replacements='''dependability dereliction dimer disinfect distributive dour efficacious ejaculate electromechanical entrails eroticism exhilaration exon extrapolation flail guttural handedness hygienist hypertext illegible immunological indefatigable individualist instrumentalist intravenously juggler languish larch malady mastodon meritocracy miscellany moxie neoprene nightshade nutritionally passerby pertussis pettiness'''.split()
          assert len(first)==500
          assert len(reject)==39 and len(replacements)==39
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          assert len(kept)==461,len(kept)
          assert all(w in parsed for w in replacements)
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(final)==500 and len(set(words))==500
          assert not (set(words)&reject)
          (root/'staging'/'batch038'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch038'/'SELECTION_SUMMARY.txt').write_text(f'kept={len(kept)}\nreplacements={len(replacements)}\nfinal={len(final)}\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch038/final_selection.tsv staging/batch038/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 038 selection'
          git push
