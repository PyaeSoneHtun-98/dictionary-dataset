name: Repair Batch 030 Translation

on:
  push:
    paths:
      - 'staging/batch030/REPAIR_TRANSLATION'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace nova translation with tourney
        run: |
          python - <<'PY'
          import pathlib
          p=pathlib.Path('staging/batch030/translations/part01.tsv')
          rows=p.read_text(encoding='utf-8').splitlines()
          assert sum(x.startswith('nova\t') for x in rows)==1
          rows=[('tourney\tnoun\tပြိုင်ပွဲ' if x.startswith('nova\t') else x) for x in rows]
          assert sum(x.startswith('tourney\t') for x in rows)==1 and not any(x.startswith('nova\t') for x in rows)
          p.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch030/translations/part01.tsv
          git commit -m 'Repair Batch 030 tourney translation'
          git push
