name: Select Batch 039 Candidates

on:
  push:
    paths:
      - 'staging/batch039/SELECT'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lexical resources
        run: |
          python -m pip install --quiet wordfreq nltk cmudict
      - name: Build strict candidate pool
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, zlib
          from wordfreq import iter_wordlist, zipf_frequency
          import cmudict
          import nltk
          from nltk.corpus import wordnet as wn, names
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text(encoding='utf-8'))
          assert m['latestBatch']==38 and m['nextBatch']==39 and m['batchCount']==38 and m['totalHeadwords']==19000
          assert m['lookup']['throughBatch']==38 and m['lookup']['uniqueLookupKeys']==32348 and m['lookup']['uniqueHeadwords']==19000 and m['lookup']['uniqueStoredForms']==13394
          enc=(root/'lookup/used_keys_current.zlib.b64').read_text(encoding='ascii').strip()
          assert hashlib.sha256(enc.encode('ascii')).hexdigest()==m['lookup']['sha256']=='1197644a8dc78666c0082892998ae6c5569a859e82e34dd3528f61f5096876e8'
          prior=set(zlib.decompress(base64.b64decode(enc)).decode('utf-8').splitlines()); assert len(prior)==32348
          nltk.download('wordnet',quiet=True); nltk.download('names',quiet=True)
          cmu=cmudict.dict(); name_set={x.lower() for x in names.words()}
          deny=set('''
          coptic garibaldi honduran pacs pentecostal sodom zimbabwean aramaic chicano hellenic hellenistic landau pollack pounder slung underpaid vips briton foretold gaba holstein malacca spas tagalog fermi gauss haydn mayflower minis salespeople toed wields axed jags mpeg narrates nicaraguan overdone pelham usmc afrikaans bedouin bolivar geordie teflon asgard cossack hani mennonite nist organics pease brahman brahmin pentecost chara cates cortland hansard hessian leninism jacobite druze pythagorean scsi anova sids pees thins esperanto lisle goldilocks gorgon wicca wiccan capra caesarean babbitt angora rottweiler pomeranian moslem mulatto hutu tutsi romani turkic fulani masai angolan calvinist tabasco superfund wedgwood etna kodiak iras aced exudes hewn sirs tans ailes alger asimov ibsen kerouac lytton noyes sorbonne suriname babar barbary bellini brezhnev bunyan gawain gwynn habsburg confucianism dmz luger
          '''.split())
          bad_def=re.compile(r'\b(?:surname|given name|capital of|city in|town in|village in|county in|state in|river in|mountain in|island in|province in|district in|region in|country in|republic in|university in|language of|native of|inhabitant of|member of a people|breed named|trademark|brand name|genus of|family of plants|family of animals|imaginary character|royal family)\b',re.I)
          person_def=re.compile(r'\b(?:united states|english|british|french|italian|german|norwegian|russian|soviet|american|greek|roman|irish|scottish|welsh)\s+(?:author|writer|poet|composer|statesman|artist|actor|actress|philosopher|scientist|politician|general|king|queen|prince|princess|theologian|preacher|comedienne|novelist)\b',re.I)
          dated_person=re.compile(r'\((?:1[5-9]|20)\d{2}[-–](?:1[5-9]|20)\d{2}\)')
          demonym_suffix=('ian','ese','ish','ite')
          def clean_word(w): return w.isascii() and w.isalpha() and w==w.lower() and 3<=len(w)<=18
          rows=[]; seen=set()
          for w in iter_wordlist('en'):
              w=w.lower().strip()
              if len(rows)>=1600: break
              if not clean_word(w) or w in prior or w in seen or w in deny or w in name_set: continue
              z=zipf_frequency(w,'en')
              if z>2.58 or z<2.18: continue
              syns=wn.synsets(w)
              if not syns or w not in cmu: continue
              if len(w)<=3 and z<2.45: continue
              syn=syns[0]
              pos={'n':'noun','v':'verb','a':'adjective','s':'adjective','r':'adverb'}.get(syn.pos())
              if not pos: continue
              defs=' '.join(s.definition() for s in syns[:4])
              if bad_def.search(defs) or person_def.search(defs) or dated_person.search(defs): continue
              # WordNet morphology: reject ordinary inflections of a different lemma.
              morph=wn.morphy(w,syn.pos())
              if morph and morph.lower()!=w: continue
              # Extra shape guards for obvious verb/adjective inflections.
              if syn.pos()=='v' and (w.endswith('ed') or w.endswith('ing') or w.endswith('s')): continue
              if syn.pos() in ('a','s') and (w.endswith('est') or w.endswith('er')) and morph and morph!=w: continue
              if w.endswith(demonym_suffix) and any(k in defs.lower() for k in ('inhabitant','language','religion','ethnic','nationality','country')): continue
              phones=' '.join(cmu[w][0])
              rows.append((w,pos,z,phones,syn.definition().replace('\t',' '))); seen.add(w)
          assert len(rows)==1600,len(rows)
          out=root/'staging'/'batch039'/'candidates'; out.mkdir(parents=True,exist_ok=True)
          for old in out.glob('candidates_*.tsv'): old.unlink()
          for i in range(0,1600,50):
              p=out/f'candidates_{i//50+1:02d}.tsv'
              p.write_text('\n'.join(f'{w}\t{pos}\t{z:.2f}\t{phones}\t{definition}' for w,pos,z,phones,definition in rows[i:i+50])+'\n',encoding='utf-8')
          (root/'staging'/'batch039'/'SELECTION_META.json').write_text(json.dumps({'batch':39,'priorLookupKeys':len(prior),'candidateCount':len(rows),'zipfMin':min(x[2] for x in rows),'zipfMax':max(x[2] for x in rows)},indent=2)+'\n')
          print('selected',len(rows),'range',rows[0][2],rows[-1][2])
          PY
      - name: Commit candidates
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch039/candidates staging/batch039/SELECTION_META.json
          git commit -m 'Regenerate cleaner Batch 039 candidates'
          git push
