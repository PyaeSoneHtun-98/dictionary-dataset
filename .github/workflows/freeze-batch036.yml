name: Freeze Batch 036 Selection

on:
  push:
    paths:
      - 'staging/batch036/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch036'/'candidates'
          rows=[]
          for i in range(1,27):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,11):
              first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('''organics pease hawes parkes adrenalin cockney knesset sputnik stanhope agua airforce stank debs mormonism fora jewry campion delft
          okey primus prozac psychics pygmy quin raines stadia stetson
          bahraini dewar dink ephesus gees hmong inlaid
          mujahideen rubicon scape taos vats
          anas awol berber bowes cots fads
          rorschach salvadoran septa somalis
          downes electrics hypo leger lowes
          permeates publically reis unsaid
          xhosa bade canfield eldorado elysium eons kegs
          sacra saddens thais toda virginian trig'''.split())
          replacements='''bight biohazard camber collapsible contractually contravention copier creamery dicey disinfection downtrodden drowsiness dutifully dysplasia ecologist effluent egress encephalopathy eventuality evermore excretion exhibitor extrapolate flavorful galena ghee gravitation harmonize honeysuckle hypothalamus indenture inimitable longhorn manifestly metamorphic motility mucosa obsolescence obstetrician overstate penile perfusion pessimist plantain poser quip recyclable
          reenactment refit rejuvenate resplendent rhythmically signer signet silicate squall starlet stratum strenuously surmise swordfish thermonuclear timeliness tincture traitorous transact triumphantly underpin unseemly unsympathetic wale'''.split()
          assert len(first)==500
          assert len(reject)==71 and len(replacements)==71
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          assert len(kept)==429,len(kept)
          assert all(w in parsed for w in replacements)
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(final)==500 and len(set(words))==500
          assert not (set(words)&reject)
          (root/'staging'/'batch036'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch036'/'SELECTION_SUMMARY.txt').write_text(f'kept={len(kept)}\nreplacements={len(replacements)}\nfinal={len(final)}\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch036/final_selection.tsv staging/batch036/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 036 selection'
          git push
