name: Second Sweep Batch 045 Selection

on:
  push:
    paths:
      - 'staging/batch045/SWEEP2'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace second-sweep rejects
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch045'/'candidates'
          rows=[]
          for i in range(1,21):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          path=root/'staging'/'batch045'/'final_selection.tsv'
          final=[x for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=['ladino','parisienne','provera','newspeak']
          replacements=['parsec','piton','reconfirm','runup']
          words=[r.split('\t',1)[0] for r in final]
          assert len(final)==500 and len(set(words))==500
          assert all(w in words for w in reject)
          assert all(w in parsed and w not in words for w in replacements)
          kept=[r for r in final if r.split('\t',1)[0] not in reject]
          out=kept+[parsed[w] for w in replacements]
          out_words=[r.split('\t',1)[0] for r in out]
          assert len(out)==500 and len(set(out_words))==500
          path.write_text('\n'.join(out)+'\n',encoding='utf-8')
          (root/'staging'/'batch045'/'SELECTION_SUMMARY.txt').write_text(
              'retained=458\nreplacements=42\nsecondSweepReplacements=4\nfinal=500\n',
              encoding='utf-8')
          print('second sweep replacements', reject, '->', replacements)
          PY
      - name: Commit second sweep
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch045/final_selection.tsv staging/batch045/SELECTION_SUMMARY.txt
          git commit -m 'Refine Batch 045 selection'
          git push
