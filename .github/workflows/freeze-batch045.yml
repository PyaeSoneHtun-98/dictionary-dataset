name: Freeze Batch 045 Selection

on:
  push:
    paths:
      - 'staging/batch045/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch045'/'candidates'
          rows=[]
          for i in range(1,21):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,6):
              first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('''algol guyot irregardless lxi potlatch adar camomile coss egger nardo sambuca stygian syphon garand gyp hansom klansman shema airedale carioca drachma allgood chartist dionysian lapin pepperidge seventieth cacique dacron golconda hellenism ojibwa chait kafkaesque nestorian angstrom cresson ebonics jewess masonite soja tatu'''.split())
          replacements='''friary gobbledygook grazier heatedly hoodwink incongruously intrepidity landholder latitudinal mazer mincer misbegotten monopolist nonsectarian nonsurgical odorous overrate redbird reflexivity schmooze scrimshaw showplace straggler supportable thole angelfish babushka ballyhoo benignly bilby burgomaster cabby canty caplin commodious exactitude fluoroscopy handwoven hayloft inseparably noncompetitive nonfatal'''.split()
          assert len(first)==500 and len(reject)==42 and len(replacements)==42
          first_words=[r.split('\t',1)[0] for r in first]
          assert reject <= set(first_words), sorted(reject-set(first_words))
          assert all(w in parsed for w in replacements)
          assert not (set(replacements)&set(first_words))
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(kept)==458 and len(final)==500 and len(set(words))==500
          (root/'staging'/'batch045'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch045'/'SELECTION_SUMMARY.txt').write_text('retained=458\nreplacements=42\nfinal=500\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch045/final_selection.tsv staging/batch045/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 045 selection'
          git push
