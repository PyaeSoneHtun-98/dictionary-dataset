name: Validate Dictionary Extension

on:
  push:
    branches: [master]
    paths:
      - "DictionaryExtensionBatches/**"
      - "dictionary_extension_manifest.json"
      - "extension_lookup/**"
      - "scripts/validate_extension_batch.py"
      - "scripts/rebuild_extension_lookup.py"
      - "scripts/build_extension_artifact.py"
      - "extension_closed_compound_allowlist.txt"
      - "extension_rejected_headwords.txt"
      - "dist/dictionary_extension*.json"
      - "tests/test_extension_dictionary.py"
      - ".github/workflows/validate-dictionary-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset
        uses: actions/checkout@v4

      - name: Validate extension batches
        shell: bash
        run: |
          shopt -s nullglob
          files=(DictionaryExtensionBatches/dictionary_batch_*.json)
          for file in "${files[@]}"; do
            number="${file##*_}"
            number="${number%.json}"
            expected=$((10#$number))
            python scripts/validate_extension_batch.py "$file" --expected-batch "$expected"
          done

      - name: Verify frozen v1 base lookup is available
        run: |
          test -s lookup/used_keys_current.zlib.b64
          echo "Extension batches validated against frozen v1 lookup."

      # Sync writes derived state in a separate job; validate a fresh snapshot
      # here so a newly pushed batch is not rejected for pre-sync metadata.
      - name: Build and test extension snapshot
        run: |
          python scripts/rebuild_extension_lookup.py --write
          python scripts/build_extension_artifact.py --write
          python -m unittest tests/test_extension_dictionary.py
