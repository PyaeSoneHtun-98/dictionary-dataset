name: Finalize Dictionary Batch 033

on:
  push:
    paths:
      - 'staging/batch033/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pronunciation helper
        run: python -m pip install --quiet eng-to-ipa
      - name: Assemble and validate Batch 033
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, shutil, zlib
          import eng_to_ipa as e2i
          root=pathlib.Path('.')
          manifest_path=root/'dictionary_manifest.json'; lookup_path=root/'lookup'/'used_keys_current.zlib.b64'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['latestBatch']==32 and manifest['nextBatch']==33 and manifest['batchCount']==32 and manifest['totalHeadwords']==16000
          assert manifest['lookup']['throughBatch']==32 and manifest['lookup']['uniqueLookupKeys']==28694 and manifest['lookup']['uniqueStoredForms']==12740
          encoded=lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest()==manifest['lookup']['sha256']=='6bcf9a4279cb63b88d4ab6d6a03deaf3cc6e4e1565737c85bbbe3a34d97b12ac'
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines()); assert len(prior)==28694
          rows=[]
          for raw in (root/'staging/batch033/final_selection.tsv').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  w,pos,freq,phones,definition=raw.split('\t',4)
                  rows.append({'word':w.strip(),'phones':phones.strip()})
          words=[r['word'] for r in rows]; headset=set(words); source_by={r['word']:r for r in rows}
          assert len(rows)==500 and len(headset)==500 and not (headset&prior)
          translations={}
          for p in sorted((root/'staging/batch033/translations').glob('part*.tsv')):
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  w,pos,blob=(x.strip() for x in raw.split('\t',2)); glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  assert w not in translations; translations[w]=(pos,glosses)
          assert len(translations)==500 and set(translations)==headset
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}; latin=re.compile(r'[A-Za-z]')
          for w,(pos,g) in translations.items(): assert pos in allowed and 1<=len(g)<=3 and all(x and not latin.search(x) for x in g)
          staged=json.loads((root/'staging/batch033/TRANSLATION_VALIDATION.json').read_text(encoding='utf-8'))
          assert staged['finalWords']==500 and staged['uniqueWords']==500 and staged['translations']==500 and not staged['priorCollisions'] and not staged['malformed'] and not staged['duplicates'] and not staged['missing'] and not staged['extra'] and not staged['badGlossOrPos']
          reviewed_forms={
            'downplay':['downplays','downplayed','downplaying'],'enquire':['enquires','enquired','enquiring'],'ensue':['ensues','ensued','ensuing'],
            'exterminate':['exterminates','exterminated','exterminating'],'faze':['fazes','fazed','fazing'],'generalize':['generalizes','generalized','generalizing'],
            'scissor':['scissored','scissoring'],'disengage':['disengages','disengaged','disengaging'],'expend':['expends','expended','expending'],
            'reevaluate':['reevaluates','reevaluated','reevaluating'],'spew':['spews','spewed','spewing'],'finalize':['finalizes','finalized','finalizing'],
            'quench':['quenches','quenched','quenching'],'rationalize':['rationalizes','rationalized','rationalizing'],'rework':['reworks','reworked','reworking'],
            'darken':['darkens','darkened','darkening'],'divest':['divests','divested','divesting'],'pertain':['pertains','pertained','pertaining'],
            'populate':['populates','populated','populating'],'reshape':['reshapes','reshaped','reshaping'],'revitalize':['revitalizes','revitalized','revitalizing'],
            'undress':['undresses','undressing'],'cede':['cedes','ceded','ceding'],'depress':['depresses','depressing'],'pollute':['pollutes','polluting'],
            'publicize':['publicizes','publicizing'],'quicken':['quickens','quickened','quickening']
          }
          verb_words={w for w,(pos,_) in translations.items() if pos=='verb'}; assert verb_words==set(reviewed_forms)
          dry=json.loads((root/'staging/batch033/ASSEMBLY_DRYRUN.json').read_text(encoding='utf-8'))
          assert dry['verbForms']==reviewed_forms and dry['proposedFormCount']==76 and dry['verbCount']==27
          all_forms=[f for w in words for f in reviewed_forms.get(w,[])]; assert len(all_forms)==76 and len(set(all_forms))==76
          assert not (set(all_forms)&prior) and not (set(all_forms)&headset)
          def fallback_ipa(phones):
              cmap={'B':'b','CH':'tʃ','D':'d','DH':'ð','F':'f','G':'ɡ','HH':'h','JH':'dʒ','K':'k','L':'l','M':'m','N':'n','NG':'ŋ','P':'p','R':'r','S':'s','SH':'ʃ','T':'t','TH':'θ','V':'v','W':'w','Y':'j','Z':'z','ZH':'ʒ'}
              vmap={'AA':'ɑ','AE':'æ','AO':'ɔ','AW':'aʊ','AY':'aɪ','EH':'ɛ','EY':'eɪ','IH':'ɪ','IY':'i','OW':'oʊ','OY':'ɔɪ','UH':'ʊ','UW':'u'}; vowels=set(vmap)|{'AH','ER'}; out=[]
              for tok in phones.split():
                  mm=re.match(r'^([A-Z]+)([012])?$',tok); assert mm,(phones,tok); base,stress=mm.group(1),mm.group(2)
                  if base=='AH': sym='ə' if stress=='0' else 'ʌ'
                  elif base=='ER': sym='ɚ' if stress=='0' else 'ɝ'
                  elif base in vmap: sym=vmap[base]
                  else: sym=cmap[base]
                  if stress=='1' and base in vowels: sym='ˈ'+sym
                  elif stress=='2' and base in vowels: sym='ˌ'+sym
                  out.append(sym)
              return ''.join(out)
          entries=[]; fallback=[]
          for word in words:
              pos,glosses=translations[word]
              ipa=e2i.convert(word,stress_marks='both').strip()
              if not ipa or '*' in ipa or ipa.lower()==word.lower(): ipa=fallback_ipa(source_by[word]['phones']); fallback.append(word)
              ipa=ipa.replace('/','').strip(); assert ipa and '*' not in ipa
              entries.append({'word':word,'pronunciation':f'/{ipa}/','forms':list(reviewed_forms.get(word,[])),'meanings':[{'partOfSpeech':pos,'burmese':glosses}]})
          assert fallback==dry['ipaFallbackWords']
          assert fallback==['separator','thereto','thermodynamic','clove','dermatitis','headshot','laterally','adsorption','modifier','ischemic','turmeric','multivariate']
          out=root/'Batches'/'dictionary_batch_033.json'; assert not out.exists(); out.write_text(json.dumps({'version':1,'batch':33,'entries':entries},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          all_keys=prior|headset|set(all_forms); assert len(all_keys)==28694+500+76
          plain=('\n'.join(sorted(all_keys))+'\n').encode('utf-8'); lookup_encoded=base64.b64encode(zlib.compress(plain,9)).decode('ascii'); lookup_path.write_text(lookup_encoded,encoding='ascii')
          manifest['latestBatch']=33; manifest['nextBatch']=34; manifest['batchCount']=33; manifest['totalHeadwords']=16500
          manifest['lookup']['throughBatch']=33; manifest['lookup']['uniqueLookupKeys']=len(all_keys); manifest['lookup']['uniqueHeadwords']=16500; manifest['lookup']['uniqueStoredForms']=12740+76; manifest['lookup']['sha256']=hashlib.sha256(lookup_encoded.encode('ascii')).hexdigest()
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rp=root/'README.md'; readme=rp.read_text(encoding='utf-8'); old='Batches 001–032 have been generated: **16,000 unique headwords**.'; new='Batches 001–033 have been generated: **16,500 unique headwords**.'; assert old in readme; rp.write_text(readme.replace(old,new),encoding='utf-8')
          report={'batch':33,'entries':500,'newForms':76,'priorLookupKeys':28694,'uniqueLookupKeys':len(all_keys),'totalHeadwords':16500,'nextBatch':34,'ipaFallbackCount':len(fallback),'ipaFallbackWords':fallback,'lookupSha256':manifest['lookup']['sha256'],'formsReviewed':True}
          (root/'batch033_validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          shutil.rmtree(root/'staging'/'batch033')
          for name in ['select-batch033.yml','freeze-batch033.yml','normalize-batch033-translations.yml','validate-batch033.yml','dryrun-batch033.yml','finalize-batch033.yml']:
              p=root/'.github'/'workflows'/name
              if p.exists(): p.unlink()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit Batch 033 atomically
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Add dictionary Batch 033'
          git push
