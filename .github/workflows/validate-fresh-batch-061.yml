name: Validate Fresh Batch 061

on:
  push:
    branches:
      - "audit/fresh-batch-061"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Batch 061
        run: python scripts/validate_extension_batch.py DictionaryExtensionBatches/dictionary_batch_061.json --expected-batch 61
