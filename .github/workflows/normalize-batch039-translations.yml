name: Normalize Batch 039 Translations

on:
  push:
    paths:
      - 'staging/batch039/NORMALIZE'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize exact TSV rows
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          tdir=root/'staging'/'batch039'/'translations'
          files=sorted(tdir.glob('part*.tsv'))
          assert len(files)==5,[p.name for p in files]
          total=0
          for p in files:
              out=[]
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  parts=raw.split('\t')
                  assert len(parts)==3,(p.name,raw)
                  w,pos,gloss=(x.strip() for x in parts)
                  assert w and pos and gloss
                  out.append(f'{w}\t{pos}\t{gloss}')
              assert len(out)==100,(p.name,len(out))
              total+=len(out)
              p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          assert total==500,total
          print('normalized',total)
          PY
      - name: Commit normalization
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch039/translations
          git diff --cached --quiet || git commit -m 'Normalize Batch 039 translations'
          git push
