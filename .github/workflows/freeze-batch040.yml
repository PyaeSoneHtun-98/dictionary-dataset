name: Freeze Batch 040 Selection

on:
  push:
    paths:
      - 'staging/batch040/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch040'/'candidates'
          rows=[]
          for i in range(1,37):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,11):
              first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('''altair cobol humvee taoism herdsmen hondo managua precambrian anatolian clydesdale freemen kissimmee memoranda andalusian fila grecian livonia moldovan oligocene rask shew taoiseach blackfoot bolshevism brougham charlottetown consortia corsican minoan newgate purim zippo aqaba arapahoe benelux gass gehrig joule ruf shylock sidon soli stalinism suva chon cenozoic emporia freemason gild lasik columbo trine vestal'''.split())
          replacements='''risque sacrilegious sacrosanct schadenfreude shakeup singe spacewalk spay tallow tamoxifen tarry temporally theatrically threadbare trilateral truant undertow unshakable verbiage yurt banality breakable breathlessly churchman claymore collate conic consecrate corticosteroid employable exhaustively fluoridation gullet hake highbrow hillock hooliganism hydroponic hyperlink imbue inattention institutionally invariance judiciously knightly liquefaction litigious lymphoid masochism maximization mohair oscillate outpace'''.split()
          assert len(first)==500
          assert len(reject)==53 and len(replacements)==53
          assert all(w in {r.split('\t',1)[0] for r in first} for w in reject)
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          assert len(kept)==447,len(kept)
          assert all(w in parsed for w in replacements)
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(final)==500 and len(set(words))==500
          assert not (set(words)&reject)
          (root/'staging'/'batch040'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch040'/'SELECTION_SUMMARY.txt').write_text(f'kept={len(kept)}\nreplacements={len(replacements)}\nfinal={len(final)}\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch040/final_selection.tsv staging/batch040/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 040 selection'
          git push
