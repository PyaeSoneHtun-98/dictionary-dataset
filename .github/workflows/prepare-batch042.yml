name: Prepare Dictionary Batch 042

on:
  push:
    paths:
      - 'staging/batch042/PREPARE'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install language helpers
        run: python -m pip install --quiet eng-to-ipa lemminflect
      - name: Normalize validate and dry-run
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, zlib
          import eng_to_ipa as e2i
          from lemminflect import getInflection
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text(encoding='utf-8'))
          assert m['latestBatch']==41 and m['nextBatch']==42 and m['batchCount']==41 and m['totalHeadwords']==20500
          assert m['lookup']['throughBatch']==41 and m['lookup']['uniqueLookupKeys']==34175 and m['lookup']['uniqueStoredForms']==13721
          enc=(root/'lookup/used_keys_current.zlib.b64').read_text(encoding='ascii').strip()
          assert hashlib.sha256(enc.encode()).hexdigest()==m['lookup']['sha256']=='7147ffc00cf2f4245cf64e54afc1ec424f1d9d02c12b3ea1f91396d00f128503'
          prior=set(zlib.decompress(base64.b64decode(enc)).decode('utf-8').splitlines()); assert len(prior)==34175

          tdir=root/'staging'/'batch042'/'translations'
          files=sorted(tdir.glob('part*.tsv')); assert len(files)==5,[p.name for p in files]
          translations={}; duplicates=[]; malformed=[]; bad=[]; part_counts={}
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}
          for p in files:
              out=[]
              for i,raw in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  if not raw.strip(): continue
                  parts=raw.split('\t')
                  if len(parts)!=3:
                      malformed.append(f'{p.name}:{i}'); continue
                  w,pos,blob=(x.strip() for x in parts)
                  glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  out.append(f'{w}\t{pos}\t{"|".join(glosses)}')
                  if w in translations: duplicates.append(w)
                  translations[w]=(pos,glosses)
                  if pos not in allowed or not (1<=len(glosses)<=3) or any(re.search(r'[A-Za-z]',g) for g in glosses): bad.append(w)
              assert len(out)==100,(p.name,len(out))
              p.write_text('\n'.join(out)+'\n',encoding='utf-8'); part_counts[p.name]=len(out)

          sel=[x for x in (root/'staging/batch042/final_selection.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          words=[]
          for i,line in enumerate(sel,1):
              parts=line.split('\t')
              if len(parts)<5: malformed.append(f'selection:{i}'); continue
              w=parts[0].strip(); words.append(w)
              if not (w.isascii() and w.isalpha() and w==w.lower() and ' ' not in w and '-' not in w): malformed.append(f'word:{w}')
          wordset=set(words); dup_words=sorted({w for w in words if words.count(w)>1}); prior_collisions=sorted(wordset&prior)
          transset=set(translations); missing=sorted(wordset-transset); extra=sorted(transset-wordset)
          report={'batch':42,'finalWords':len(words),'uniqueWords':len(wordset),'translations':len(translations),'partCounts':part_counts,'priorLookupKeys':len(prior),'priorCollisions':prior_collisions,'malformed':malformed,'duplicates':sorted(set(duplicates+dup_words)),'missing':missing,'extra':extra,'badGlossOrPos':sorted(set(bad)),'selectionReview':{'retained':454,'replacements':46,'secondSweepReplacements':4}}
          (root/'staging/batch042/TRANSLATION_VALIDATION.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          ok=(len(words)==500 and len(wordset)==500 and len(translations)==500 and all(v==100 for v in part_counts.values()) and not prior_collisions and not malformed and not duplicates and not dup_words and not missing and not extra and not bad)
          if not ok:
              print(json.dumps(report,ensure_ascii=False,indent=2)); raise SystemExit(1)

          headset=wordset; fallback=[]
          for w in words:
              s=e2i.convert(w,retrieve_all=False,stress_marks='both')
              if not s or '*' in s or s.lower()==w.lower(): fallback.append(w)
          verb_forms={}; used=set()
          for w in words:
              if translations[w][0]!='verb': continue
              forms=[]
              for tag in ('VBZ','VBD','VBN','VBG'):
                  for f in (getInflection(w,tag=tag) or ()):
                      f=f.lower().strip()
                      if not (f.isascii() and f.isalpha()) or f==w or f in prior or f in headset or f in used or f in forms: continue
                      forms.append(f); used.add(f)
              verb_forms[w]=forms
          dry={'batch':42,'entries':500,'priorLookupKeys':len(prior),'ipaFallbackCount':len(fallback),'ipaFallbackWords':fallback,'verbCount':len(verb_forms),'proposedFormCount':sum(len(v) for v in verb_forms.values()),'verbForms':verb_forms}
          (root/'staging/batch042/ASSEMBLY_DRYRUN.json').write_text(json.dumps(dry,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2)); print(json.dumps(dry,ensure_ascii=False,indent=2))
          PY
      - name: Commit prepared staging
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch042/translations staging/batch042/TRANSLATION_VALIDATION.json staging/batch042/ASSEMBLY_DRYRUN.json
          git diff --cached --quiet || git commit -m 'Prepare Batch 042 assembly'
          git push
