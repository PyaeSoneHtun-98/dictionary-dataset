name: Select Batch 030 Candidates

on:
  push:
    paths:
      - 'staging/batch030/SELECT'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lexical resources
        run: python -m pip install --quiet wordfreq nltk cmudict lemminflect
      - name: Build strict candidate pool
        run: |
          python - <<'PY'
          import base64, json, pathlib, re, zlib
          from wordfreq import iter_wordlist, zipf_frequency
          import nltk, cmudict
          from nltk.corpus import wordnet as wn, names
          from nltk.stem import WordNetLemmatizer
          nltk.download('wordnet', quiet=True); nltk.download('omw-1.4', quiet=True); nltk.download('names', quiet=True)
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text())
          assert m['latestBatch']==29 and m['nextBatch']==30 and m['lookup']['uniqueLookupKeys']==26999
          enc=(root/'lookup/used_keys_current.zlib.b64').read_text().strip()
          prior=set(zlib.decompress(base64.b64decode(enc)).decode().splitlines())
          assert len(prior)==26999
          cmu=cmudict.dict(); lem=WordNetLemmatizer()
          name_set={x.lower() for x in names.words()}
          deny_exact=set('airbus chevron corvette terminator ritz kraft mecca davenport frankenstein cupid ferrari lego jeep google facebook instagram twitter netflix tesla rolex disney marvel pokemon'.split())
          bad_defs=('trademark','a city in','a town in','capital of','country in','inhabitant of','native of','people of','language spoken','music of ','writings of ','works of ','born ','president of','king of','queen of','saint ','surname','family name','given name','a state in','province of','island in','river in','mountain in')
          demonym_suffix=('ian','ese','ish')
          ordinals={'thirteenth','fourteenth','fifteenth','sixteenth','seventeenth','eighteenth','nineteenth','twentieth','thirtieth','fortieth','fiftieth','sixtieth','seventieth','eightieth','ninetieth'}
          posmap={'n':'noun','v':'verb','a':'adjective','s':'adjective','r':'adverb'}
          def is_bad_morph(w):
              if w in ordinals: return True
              if w.endswith('est') and len(w)>5 and lem.lemmatize(w,'a')!=w: return True
              if w.endswith('er') and len(w)>4 and lem.lemmatize(w,'a')!=w: return True
              if w.endswith('ing') and len(w)>5 and lem.lemmatize(w,'v')!=w: return True
              if w.endswith(('ed','en')) and len(w)>4 and lem.lemmatize(w,'v')!=w: return True
              if w.endswith('s') and not w.endswith(('ss','us','is')) and len(w)>4 and lem.lemmatize(w,'n')!=w: return True
              return False
          rows=[]; seen=set()
          for w in iter_wordlist('en', wordlist='best'):
              w=w.lower().strip()
              if len(rows)>=900: break
              if w in seen or w in prior or w in deny_exact or w in name_set: continue
              if not (w.isascii() and w.isalpha() and w==w.lower() and 3<=len(w)<=18): continue
              z=zipf_frequency(w,'en')
              if z>3.18 or z<2.45: continue
              if is_bad_morph(w): continue
              syns=wn.synsets(w)
              if not syns or w not in cmu: continue
              usable=[]
              for s in syns:
                  p=posmap.get(s.pos())
                  if not p: continue
                  d=s.definition().strip(); dl=d.lower()
                  if any(x in dl for x in bad_defs): continue
                  if s.instance_hypernyms(): continue
                  usable.append((p,d,s))
              if not usable: continue
              # avoid likely demonyms/languages unless a clearly ordinary lexical sense exists
              if w.endswith(demonym_suffix) and any('relating to' in d.lower() and ('people' in d.lower() or 'country' in d.lower()) for _,d,_ in usable):
                  continue
              # prefer common POS in order noun/verb/adj/adv but avoid obscure first noun if a common verb/adj exists
              rank={'noun':0,'verb':1,'adjective':2,'adverb':3}
              usable.sort(key=lambda x: rank[x[0]])
              p,d,s=usable[0]
              phones=' '.join(cmu[w][0])
              rows.append((w,p,z,phones,d)); seen.add(w)
          assert len(rows)==900, len(rows)
          out=root/'staging'/'batch030'/'candidates'; out.mkdir(parents=True,exist_ok=True)
          for i in range(18):
              chunk=rows[i*50:(i+1)*50]
              (out/f'candidates_{i+1:02d}.tsv').write_text('\n'.join(f'{w}\t{p}\t{z:.2f}\t{ph}\t{d}' for w,p,z,ph,d in chunk)+'\n',encoding='utf-8')
          (out/'SUMMARY.txt').write_text(f'candidates={len(rows)}\nprior_keys={len(prior)}\nzipf=2.45..3.18\n',encoding='utf-8')
          PY
      - name: Commit candidates
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch030/candidates
          git commit -m 'Stage Batch 030 candidates'
          git push
