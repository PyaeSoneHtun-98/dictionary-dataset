name: Repair Batch 031 Selection

on:
  push:
    paths:
      - 'staging/batch031/REPAIR_SELECTION'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace tubs with handout
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          sel=root/'staging'/'batch031'/'final_selection.tsv'
          rows=[x for x in sel.read_text(encoding='utf-8').splitlines() if x.strip()]
          words=[r.split('\t',1)[0] for r in rows]
          assert len(rows)==500 and words.count('tubs')==1 and 'handout' not in words
          replacement=None
          for p in (root/'staging'/'batch031'/'candidates').glob('candidates_*.tsv'):
              for r in p.read_text(encoding='utf-8').splitlines():
                  if r.split('\t',1)[0]=='handout': replacement=r
          assert replacement
          rows=[replacement if r.split('\t',1)[0]=='tubs' else r for r in rows]
          words=[r.split('\t',1)[0] for r in rows]
          assert len(rows)==500 and len(set(words))==500 and 'tubs' not in words and 'handout' in words
          sel.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch031/final_selection.tsv
          git commit -m 'Repair Batch 031 selection'
          git push
