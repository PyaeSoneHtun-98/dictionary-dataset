name: Select Batch 036 Candidates

on:
  push:
    paths:
      - 'staging/batch036/SELECT'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lexical resources
        run: python -m pip install --quiet wordfreq nltk cmudict lemminflect
      - name: Build strict candidate pool
        run: |
          python - <<'PY'
          import base64, json, pathlib, zlib
          from wordfreq import iter_wordlist, zipf_frequency
          import nltk, cmudict
          from nltk.corpus import wordnet as wn, names
          from nltk.stem import WordNetLemmatizer
          from lemminflect import getLemma
          nltk.download('wordnet', quiet=True); nltk.download('omw-1.4', quiet=True); nltk.download('names', quiet=True)
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text())
          assert m['latestBatch']==35 and m['nextBatch']==36 and m['totalHeadwords']==17500
          assert m['lookup']['uniqueLookupKeys']==30475 and m['lookup']['uniqueStoredForms']==13021
          assert m['lookup']['sha256']=='7c4134b96c5d11d8bb8f58293d107f3e7efde402dc4500fb2c071f8c3afbe88b'
          enc=(root/'lookup/used_keys_current.zlib.b64').read_text().strip()
          prior=set(zlib.decompress(base64.b64decode(enc)).decode().splitlines())
          assert len(prior)==30475
          cmu=cmudict.dict(); lem=WordNetLemmatizer(); name_set={x.lower() for x in names.words()}
          deny=set('''fao dss ddt velcro mossad ascii polaroid firestone xerox kleenex lego google facebook instagram twitter netflix tesla rolex disney marvel pokemon xanax botox interpol opec nafta gestapo
          coptic garibaldi honduran pacs zimbabwean aramaic chicano fermi gauss haydn mayflower minis salespeople spas toed wields axed jags mpeg narrates nicaraguan overdone pelham asgard cossack hani mennonite nist roms adventist pows cordoba aquila sonora pentecost chara
          briton tagalog afrikaans bedouin bolivar brahman brahmin geordie mariachi teflon
          usmc darpa styrofoam hellenic hellenistic hausa azerbaijani tajik shona israelite stalinist atticus chippewa neapolitan gallic hanukkah sind teutonic benedictine cochin christendom darwinism freemasonry sunnis eritrean
          overlaid pews formulae twos sacs romantics firs urls coos beaux opts pled deepens thickens hallows'''.split())
          irregular_nonlemmas=set('''cuter whiter rainier lain spilt predates matures nears overpaid redone revs pips bogs dens pars sams diabetics automata slung foretold underpaid vips salespeople spas toed wields axed jags narrates overdone pows roms zips loci doings droppings overlaid pews formulae twos sacs romantics firs urls coos beaux opts pled deepens thickens hallows'''.split())
          bad_defs=('trademark','trade mark','a city in','a town in','capital of','country in','inhabitant of','native of','people of','language spoken','state language','official language','dialect of','currency of','basic unit of money','of or relating to cyprus','of or relating to samoa','of or relating to kuwait','of or relating to honduras','of or relating to zimbabwe','of or relating to nicaragua','of or relating to characteristic of','the united nations agency','intelligence agency','government agency','a member of a people','a member of the','surname','family name','given name','king of','queen of','president of','dynasty','worshipped especially','roman procurator','the music of','genus of','a genus of','tribe living','ethnic group','jewish holiday','christian holiday','muslim holiday')
          posmap={'n':'noun','v':'verb','a':'adjective','s':'adjective','r':'adverb'}
          irregular_plurals={'men','women','children','teeth','feet','geese','mice','lice','oxen','criteria','phenomena','data','media','indices','vertices','matrices','appendices','curricula','antennae','larvae','ova','sera','people','formulae','beaux','loci'}
          def bad_morph(w):
              if w in irregular_nonlemmas or w in irregular_plurals: return True
              if w.endswith('ies') and len(w)>4: return True
              if w.endswith('ves') and len(w)>4: return True
              if w.endswith('men') and len(w)>5: return True
              if w.endswith('s') and len(w)>4 and not w.endswith(('ss','us','is','ous','ics','ness')) and lem.lemmatize(w,'n')!=w: return True
              if w.endswith('est') and len(w)>5 and lem.lemmatize(w,'a')!=w: return True
              if w.endswith('er') and len(w)>4 and lem.lemmatize(w,'a')!=w: return True
              if w.endswith('ing') and len(w)>5:
                  gl=getLemma(w,'VERB') or ()
                  if lem.lemmatize(w,'v')!=w or (gl and gl[0]!=w): return True
              if w.endswith(('ed','en')) and len(w)>4:
                  gl=getLemma(w,'VERB') or ()
                  if lem.lemmatize(w,'v')!=w or (gl and gl[0]!=w): return True
              return False
          rows=[]; seen=set()
          for w in iter_wordlist('en',wordlist='best'):
              w=w.lower().strip()
              if len(rows)>=1300: break
              if w in seen or w in prior or w in deny or w in name_set: continue
              if not (w.isascii() and w.isalpha() and w==w.lower() and 3<=len(w)<=18): continue
              z=zipf_frequency(w,'en')
              if z>2.82 or z<2.00: continue
              if bad_morph(w): continue
              syns=wn.synsets(w)
              if not syns or w not in cmu: continue
              usable=[]
              for s in syns:
                  p=posmap.get(s.pos())
                  if not p or s.instance_hypernyms(): continue
                  d=s.definition().strip(); dl=d.lower()
                  if any(x in dl for x in bad_defs): continue
                  usable.append((p,d))
              if not usable: continue
              all_defs=' '.join(d.lower() for _,d in usable)
              if w.endswith(('ian','ese','ite')) and any(x in all_defs for x in ('people','country','language','culture','relating to','ethnic','religious group')): continue
              if w.endswith('ish') and any(x in all_defs for x in ('people','country','language','culture','relating to')): continue
              if len(w)<=3 and w not in {'yak','yen','yew','yaw','jot','cur','oar','asp','gnu','ebb','hap','nit','nib','keg'}: continue
              rank={'noun':0,'verb':1,'adjective':2,'adverb':3}
              usable.sort(key=lambda x:rank[x[0]])
              p,d=usable[0]
              rows.append((w,p,z,' '.join(cmu[w][0]),d)); seen.add(w)
          assert len(rows)==1300,len(rows)
          out=root/'staging'/'batch036'/'candidates'; out.mkdir(parents=True,exist_ok=True)
          for i in range(26):
              chunk=rows[i*50:(i+1)*50]
              (out/f'candidates_{i+1:02d}.tsv').write_text('\n'.join(f'{w}\t{p}\t{z:.2f}\t{ph}\t{d}' for w,p,z,ph,d in chunk)+'\n',encoding='utf-8')
          (out/'SUMMARY.txt').write_text(f'candidates={len(rows)}\nprior_keys={len(prior)}\nzipf=2.00..2.82\n',encoding='utf-8')
          PY
      - name: Commit candidates
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch036/candidates
          git commit -m 'Stage Batch 036 candidates'
          git push
