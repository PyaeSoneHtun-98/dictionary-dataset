name: Select Dictionary Batch 054

on:
  push:
    paths:
      - 'staging/batch054/SELECT'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate clean candidates
        run: |
          python - <<'PY'
          import base64, io, pathlib, re, urllib.request, zipfile, zlib

          root=pathlib.Path('.')
          stage=root/'staging'/'batch054'
          stage.mkdir(parents=True,exist_ok=True)

          used=set(zlib.decompress(base64.b64decode(
              (root/'lookup'/'used_keys_current.zlib.b64').read_text().strip()
          )).decode().splitlines())

          def raw(url):
              with urllib.request.urlopen(url,timeout=40) as r:
                  return r.read()
          def text(url):
              return raw(url).decode('utf-8')

          wn='https://raw.githubusercontent.com/evllabs/JGAAP/master/src/com/jgaap/resources/wordnet/'
          source={}; alllex=set()
          for pos,file in [('noun','index.noun'),('verb','index.verb'),('adjective','index.adj'),('adverb','index.adv')]:
              s=set()
              for line in text(wn+file).splitlines():
                  if not line or line.startswith(' '): continue
                  w=line.split()[0].lower()
                  if re.fullmatch(r'[a-z]{4,18}',w):
                      s.add(w); alllex.add(w)
              source[pos]=s

          # Exclude WordNet noun.person and noun.location lemmas.
          bad_sem=set()
          for line in text(wn+'data.noun').splitlines():
              if not line or line.startswith(' '): continue
              left=line.split('|',1)[0].split()
              if len(left)<5: continue
              try:
                  lexnum=int(left[1]); wc=int(left[3],16)
              except: continue
              if lexnum not in (15,18): continue
              j=4
              for _ in range(wc):
                  if j+1>=len(left): break
                  w=left[j].lower()
                  if '_' not in w and re.fullmatch(r'[a-z]{4,18}',w):
                      bad_sem.add(w)
                  j+=2

          # Exclude common first names.
          names=set()
          try:
              z=zipfile.ZipFile(io.BytesIO(raw(
                  'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/names.zip'
              )))
              for fn in z.namelist():
                  if fn.endswith(('male.txt','female.txt')):
                      names.update(
                          x.strip().lower()
                          for x in z.read(fn).decode().splitlines()
                          if x.strip().isalpha()
                      )
          except Exception:
              pass

          # Frequency ranking.
          freq={}
          freqtext=text('https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt')
          for i,line in enumerate(freqtext.splitlines(),1):
              p=line.split()
              if p and p[0] not in freq:
                  freq[p[0]]=i

          bad=set('''american english french german chinese british spanish russian japanese indian italian christian jewish greek catholic soviet irish korean mexican african nazi asian swedish arabic turkish canadian thai egyptian scottish australian vietnamese portuguese danish brazilian israeli hebrew hungarian islamic norwegian buddhist hindu czech iraqi iranian indonesian dutch cuban swiss muslim arab
          america england france germany china japan india italy russia mexico canada spain britain europe africa asia texas california chicago paris london rome washington hollywood israel tokyo berlin boston florida miami scotland korea moscow australia vietnam egypt iraq brazil georgia hawaii manhattan seattle houston dallas cuba venice milan switzerland poland vienna seoul ireland jerusalem greece delhi mumbai arizona oxford ohio shanghai sweden holland denver madrid thailand pakistan philadelphia alaska carolina colorado iran baltimore amsterdam mississippi portugal norway manchester prague indiana denmark santiago michigan portland singapore taiwan athens geneva argentina beijing babylon nevada austria dubai columbia richmond istanbul toronto kentucky warsaw barcelona bangkok oregon munich belgium stockholm connecticut orlando columbus pittsburgh tennessee cambridge salem dakota alabama louisiana brussels illinois montreal syria oklahoma maine osaka cairo memphis peru kyoto baghdad chile copenhagen
          bible quran koran torah allah buddha satan zeus krishna shiva nasa fbi cia nsa kgb nato interpol gestapo taliban vatican google twitter cisco disney beatles viagra ipod
          '''.split())|names|bad_sem

          irregular=set('''been gone done made said seen taken given known shown written driven broken spoken chosen thrown grown drawn flown worn born fallen hidden eaten forgotten begun sung rung sunk drank drunk swum ran came went saw felt heard held kept left lost paid sold told thought brought bought caught taught fought found built sent spent sat stood lay led read meant met put cut hit hurt let set shut cost cast burst split spread bet beat struck stuck fed bled bred fled hung dug spun won lost'''.split())

          def canonical(w):
              if w in bad or w in irregular: return False
              if w.endswith('ies') and w[:-3]+'y' in alllex: return False
              if w.endswith('es') and w[:-2] in alllex: return False
              if w.endswith('s') and w[:-1] in alllex: return False
              if w.endswith('ing'):
                  s=w[:-3]
                  if s in alllex or s+'e' in alllex or (len(s)>2 and s[-1]==s[-2] and s[:-1] in alllex):
                      return False
              if w.endswith('ed'):
                  s=w[:-2]
                  if s in alllex or s+'e' in alllex or (len(s)>2 and s[-1]==s[-2] and s[:-1] in alllex):
                      return False
              if w.endswith('er') and w[:-2] in source['adjective']: return False
              if w.endswith('est') and w[:-3] in source['adjective']: return False
              return True

          rows=[]
          for w in alllex:
              if w in used or not canonical(w): continue
              r=freq.get(w,999999)
              if r < 5000: continue
              if w in source['verb']: pos='verb'
              elif w in source['noun']: pos='noun'
              elif w in source['adjective']: pos='adjective'
              else: pos='adverb'
              score=(r if r<999999 else 180000)+len(w)*35
              # Prefer verbs and concrete/common nouns over technical prefixed derivatives.
              if pos=='verb': score-=250
              elif pos=='noun': score-=80
              if re.match(r'^(non|anti|counter|inter|intra|multi|pre|post|sub|super|hyper|hypo|over|under)',w):
                  score+=1800
              rows.append((score,w,pos))

          rows.sort(key=lambda x:(x[0],x[1]))
          selected=[(w,p) for _,w,p in rows[:900]]
          assert len(selected)==900
          assert len({w for w,_ in selected})==900
          assert not ({w for w,_ in selected}&used)
          (stage/'candidates.tsv').write_text(
              ''.join(f'{w}\t{p}\n' for w,p in selected),encoding='utf-8'
          )
          (stage/'SELECT').unlink(missing_ok=True)
          wf=root/'.github'/'workflows'/'select-batch054.yml'
          if wf.exists(): wf.unlink()
          print('candidates',len(selected))
          PY

      - name: Commit candidates
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Generate Batch 054 candidates"
          git push
