name: Reselect Dictionary Batch 052

on:
  push:
    paths:
      - 'staging/batch052/RESELECT'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select clean unused candidates
        run: |
          python - <<'PY'
          import base64, io, pathlib, re, urllib.request, zipfile, zlib

          root=pathlib.Path('.'); stage=root/'staging'/'batch052'
          encoded=(root/'lookup'/'used_keys_current.zlib.b64').read_text(encoding='ascii').strip()
          used=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())

          def raw(url):
              with urllib.request.urlopen(url,timeout=40) as r: return r.read()
          def text(url): return raw(url).decode('utf-8')

          wn='https://raw.githubusercontent.com/evllabs/JGAAP/master/src/com/jgaap/resources/wordnet/'
          source={}; alllex=set()
          for pos,file in [('noun','index.noun'),('verb','index.verb'),('adjective','index.adj'),('adverb','index.adv')]:
              s=set()
              for line in text(wn+file).splitlines():
                  if not line or line.startswith(' '): continue
                  w=line.split()[0].lower()
                  if re.fullmatch(r'[a-z]{4,18}',w): s.add(w); alllex.add(w)
              source[pos]=s

          # Any single-word noun occurring in noun.person or noun.location is excluded.
          bad_semantic=set()
          for line in text(wn+'data.noun').splitlines():
              if not line or line.startswith(' '): continue
              left=line.split('|',1)[0].split()
              if len(left)<5: continue
              try:
                  lexnum=int(left[1]); wc=int(left[3],16)
              except: continue
              if lexnum not in (15,18): continue
              j=4
              for _ in range(wc):
                  if j+1>=len(left): break
                  w=left[j].lower()
                  if '_' not in w and re.fullmatch(r'[a-z]{4,18}',w): bad_semantic.add(w)
                  j+=2

          # NLTK first names.
          names=set()
          try:
              z=zipfile.ZipFile(io.BytesIO(raw('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/names.zip')))
              for fn in z.namelist():
                  if fn.endswith(('male.txt','female.txt')):
                      for x in z.read(fn).decode('utf-8').splitlines():
                          x=x.strip().lower()
                          if x.isalpha(): names.add(x)
          except Exception as e:
              print('names warning',e)

          freq={}
          for i,line in enumerate(text('https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt').splitlines(),1):
              p=line.split()
              if p and p[0] not in freq: freq[p[0]]=i

          banned=set('''america england france germany china japan india italy russia mexico canada spain britain europe africa asia
          texas california chicago paris london rome washington hollywood israel tokyo berlin boston florida miami scotland korea moscow
          australia vietnam egypt iraq brazil georgia hawaii manhattan seattle houston dallas cuba venice milan switzerland poland vienna seoul
          ireland jerusalem greece delhi mumbai arizona oxford ohio shanghai sweden holland denver madrid thailand pakistan philadelphia alaska
          carolina colorado iran baltimore amsterdam mississippi portugal norway manchester prague indiana denmark santiago michigan portland
          singapore taiwan athens geneva argentina beijing babylon nevada austria dubai columbia richmond istanbul toronto kentucky warsaw
          barcelona bangkok oregon munich belgium stockholm connecticut orlando columbus pittsburgh tennessee zealand cambridge salem dakota
          alabama louisiana brussels illinois montreal syria oklahoma maine osaka cairo memphis peru kyoto baghdad chile copenhagen
          american english french german chinese british spanish russian japanese indian italian christian jewish greek catholic soviet irish korean mexican
          african nazi asian swedish arabic turkish canadian thai egyptian scottish australian vietnamese portuguese danish brazilian israeli hebrew hungarian
          islamic norwegian buddhist hindu czech iraqi iranian indonesian dutch cuban swiss muslim arab
          nasa fbi cia nsa kgb nato interpol gestapo taliban vatican google twitter cisco beatles disney harvard yale viagra ipod
          bible quran koran torah allah buddha satan zeus krishna shiva
          '''.split()) | names | bad_semantic

          reject=set('''cetera bianco coste corne cul dea diff doble doo ell entre epsom fait ken mano par russe stein centum centrex darlin derring gentlelady goverment jakes klieg knott kraut krona kroner lima linage lobo lookit lulu majeure markkaa mealynose millon
          saw felt made said gone heard used taken tried born written built held sold ate sat led grown forgotten kept paid finished stopped liked turned loved
          things years days times words works lots being going coming talking getting taking looking saying working playing living waiting telling running giving speaking using happening sitting crying wearing killing standing dying walking starting eating driving holding beginning drinking listening helping keeping acting
          '''.split())

          def canonical(w):
              if w in banned or w in reject: return False
              if w.endswith('ies') and w[:-3]+'y' in alllex: return False
              if w.endswith('es') and w[:-2] in alllex: return False
              if w.endswith('s') and w[:-1] in alllex: return False
              if w.endswith('ing'):
                  s=w[:-3]
                  if s in alllex or s+'e' in alllex or (len(s)>2 and s[-1]==s[-2] and s[:-1] in alllex): return False
              if w.endswith('ed'):
                  s=w[:-2]
                  if s in alllex or s+'e' in alllex or (len(s)>2 and s[-1]==s[-2] and s[:-1] in alllex): return False
              if w.endswith('er') and w[:-2] in source['adjective']: return False
              if w.endswith('est') and w[:-3] in source['adjective']: return False
              return True

          rows=[]
          for w in alllex:
              if w in used or not canonical(w): continue
              r=freq.get(w,999999)
              if r < 3500: continue
              if w in source['noun']: pos='noun'
              elif w in source['verb']: pos='verb'
              elif w in source['adjective']: pos='adjective'
              else: pos='adverb'
              score=(r if r<999999 else 180000)+len(w)*35
              if pos=='verb': score-=100
              if re.match(r'^(non|anti|counter|inter|intra|multi|pre|post|sub|super|hyper|hypo|over)',w): score+=1500
              rows.append((score,w,pos))
          rows.sort(key=lambda x:(x[0],x[1]))
          sel=[(w,p) for _,w,p in rows[:700]]
          assert len(sel)==700 and len({w for w,_ in sel})==700
          assert not ({w for w,_ in sel}&used)
          (stage/'candidates.tsv').write_text(''.join(f'{w}\t{p}\n' for w,p in sel),encoding='utf-8')
          (stage/'RESELECT').unlink(missing_ok=True)
          wf=root/'.github'/'workflows'/'reselect-batch052.yml'
          if wf.exists(): wf.unlink()
          print('selected',len(sel),'names',len(names),'semantic',len(bad_semantic))
          PY
      - name: Commit clean candidates
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Reselect Batch 052 candidates"
          git push
