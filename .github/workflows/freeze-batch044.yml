name: Freeze Batch 044 Selection

on:
  push:
    paths:
      - 'staging/batch044/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch044'/'candidates'
          rows=[]
          for i in range(1,23):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,6):
              first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('''arapaho dickensian peavy stander strayer aerie americanization aneurism astrakhan bostonian fauntleroy hapsburg oklahoman pasteurization sunglass anasazi blest bourn lucite swart sixtieth stuffer unfrozen vernier westernization yagi cheviot copernican egyptology spic atheneum campana carolinian dunker jacksonian occident paiute boule greaser homburg jynx kwanzaa loth maser moulder neighbourly poinsettia strategical wagnerian aborigine bougainvillea chukchi dictaphone groat'''.split())
          replacements='''invitee ironical laudatory laughingly loquacious medicinally monism monoclinic mouser obviate opprobrium parsimony plunk preconception printmaker receptivity remediate retread souther stagecraft surveil toller torte tribesman turbojet underrate verboten withe yachtsman baleen bodkin calligrapher cannibalize caul cloudiness compartmentalize coppery cottonmouth desultory disequilibrium dismally effete emptor expropriate fetter flutist frugally fruitlessly goshawk gravimetric inescapably insensible intermingle lade'''.split()
          assert len(first)==500 and len(reject)==54 and len(replacements)==54
          first_words=[r.split('\t',1)[0] for r in first]
          assert reject <= set(first_words), sorted(reject-set(first_words))
          assert all(w in parsed for w in replacements)
          assert not (set(replacements)&set(first_words))
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(kept)==446 and len(final)==500 and len(set(words))==500
          (root/'staging'/'batch044'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch044'/'SELECTION_SUMMARY.txt').write_text('retained=446\nreplacements=54\nfinal=500\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch044/final_selection.tsv staging/batch044/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 044 selection'
          git push
