name: Finalize Dictionary Batch 046

on:
  push:
    paths:
      - 'staging/batch046/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pronunciation helpers
        run: python -m pip install --quiet eng-to-ipa cmudict

      - name: Assemble and validate Batch 046
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, shutil, zlib
          import eng_to_ipa as e2i
          import cmudict

          root = pathlib.Path('.')
          manifest_path = root / 'dictionary_manifest.json'
          lookup_path = root / 'lookup' / 'used_keys_current.zlib.b64'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          assert manifest['latestBatch'] == 45
          assert manifest['nextBatch'] == 46
          assert manifest['batchCount'] == 45
          assert manifest['totalHeadwords'] == 22500
          assert manifest['lookup']['throughBatch'] == 45
          assert manifest['lookup']['uniqueLookupKeys'] == 36891
          assert manifest['lookup']['uniqueHeadwords'] == 22500
          assert manifest['lookup']['uniqueStoredForms'] == 14437

          encoded = lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == manifest['lookup']['sha256'] == 'f0d89f714330c000c4e7e8f3326e6e7b1af3c74ce33b5f134bd43279df70bef1'
          prior = set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())
          assert len(prior) == 36891

          rows = []
          part_counts = {}
          for p in sorted((root / 'staging' / 'batch046' / 'translations').glob('part*.tsv')):
              count = 0
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip():
                      continue
                  word, pos, gloss = (x.strip() for x in raw.split('\t', 2))
                  rows.append((word, pos, gloss))
                  count += 1
              part_counts[p.name] = count

          assert part_counts == {
              'part01.tsv': 100,
              'part02.tsv': 100,
              'part03.tsv': 100,
              'part04.tsv': 100,
              'part05.tsv': 100,
          }, part_counts
          assert len(rows) == 500

          words = [w for w, _, _ in rows]
          headset = set(words)
          assert len(headset) == 500
          assert not (headset & prior), sorted(headset & prior)
          assert all(w.isascii() and w.isalpha() and w == w.lower() for w in words)

          allowed = {
              'noun', 'verb', 'adjective', 'adverb', 'pronoun', 'preposition',
              'conjunction', 'interjection', 'determiner', 'modal', 'auxiliary',
          }
          latin = re.compile(r'[A-Za-z]')
          for word, pos, gloss in rows:
              assert pos in allowed, (word, pos)
              assert gloss and not latin.search(gloss), (word, gloss)

          # Batch 046 intentionally contains no verb headwords, so there are
          # no generated verb forms to review or store.
          assert not any(pos == 'verb' for _, pos, _ in rows)

          cmap = {
              'B':'b','CH':'tʃ','D':'d','DH':'ð','F':'f','G':'ɡ','HH':'h',
              'JH':'dʒ','K':'k','L':'l','M':'m','N':'n','NG':'ŋ','P':'p',
              'R':'r','S':'s','SH':'ʃ','T':'t','TH':'θ','V':'v','W':'w',
              'Y':'j','Z':'z','ZH':'ʒ'
          }
          vmap = {
              'AA':'ɑ','AE':'æ','AO':'ɔ','AW':'aʊ','AY':'aɪ','EH':'ɛ',
              'EY':'eɪ','IH':'ɪ','IY':'i','OW':'oʊ','OY':'ɔɪ','UH':'ʊ','UW':'u'
          }
          vowels = set(vmap) | {'AH', 'ER'}

          def fallback_ipa(tokens):
              out = []
              for tok in tokens:
                  m = re.match(r'^([A-Z]+)([012])?$', tok)
                  assert m, (tokens, tok)
                  base, stress = m.group(1), m.group(2)
                  if base == 'AH':
                      sym = 'ə' if stress == '0' else 'ʌ'
                  elif base == 'ER':
                      sym = 'ɚ' if stress == '0' else 'ɝ'
                  elif base in vmap:
                      sym = vmap[base]
                  else:
                      sym = cmap[base]
                  if stress == '1' and base in vowels:
                      sym = 'ˈ' + sym
                  elif stress == '2' and base in vowels:
                      sym = 'ˌ' + sym
                  out.append(sym)
              return ''.join(out)

          cmu = cmudict.dict()
          entries = []
          fallback_words = []
          for word, pos, gloss in rows:
              ipa = e2i.convert(word, stress_marks='both').strip()
              if not ipa or '*' in ipa or ipa.lower() == word.lower():
                  phones = cmu.get(word)
                  assert phones, f'No IPA/CMU pronunciation for {word}'
                  ipa = fallback_ipa(phones[0])
                  fallback_words.append(word)
              ipa = ipa.replace('/', '').strip()
              assert ipa and '*' not in ipa and '\n' not in ipa, (word, ipa)
              entries.append({
                  'word': word,
                  'pronunciation': f'/{ipa}/',
                  'forms': [],
                  'meanings': [{
                      'partOfSpeech': pos,
                      'burmese': [gloss]
                  }]
              })

          assert len(entries) == 500
          assert len({e['word'] for e in entries}) == 500
          assert all(1 <= sum(len(m['burmese']) for m in e['meanings']) <= 3 for e in entries)

          out = root / 'Batches' / 'dictionary_batch_046.json'
          assert not out.exists(), 'Batch 046 already exists'
          out.write_text(
              json.dumps({'version': 1, 'batch': 46, 'entries': entries}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          all_keys = prior | headset
          assert len(all_keys) == 36891 + 500 == 37391
          plain = ('\n'.join(sorted(all_keys)) + '\n').encode('utf-8')
          lookup_encoded = base64.b64encode(zlib.compress(plain, 9)).decode('ascii')
          lookup_path.write_text(lookup_encoded, encoding='ascii')

          manifest['latestBatch'] = 46
          manifest['nextBatch'] = 47
          manifest['batchCount'] = 46
          manifest['totalHeadwords'] = 23000
          manifest['lookup']['throughBatch'] = 46
          manifest['lookup']['uniqueLookupKeys'] = 37391
          manifest['lookup']['uniqueHeadwords'] = 23000
          manifest['lookup']['uniqueStoredForms'] = 14437
          manifest['lookup']['sha256'] = hashlib.sha256(lookup_encoded.encode('ascii')).hexdigest()
          assert manifest['totalHeadwords'] == manifest['batchCount'] * 500
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          rp = root / 'README.md'
          text = rp.read_text(encoding='utf-8')
          old = 'Batches 001–045 have been generated: **22,500 unique headwords**.'
          new = 'Batches 001–046 have been generated: **23,000 unique headwords**.'
          assert old in text
          rp.write_text(text.replace(old, new), encoding='utf-8')

          report = {
              'batch': 46,
              'entries': 500,
              'newForms': 0,
              'priorLookupKeys': 36891,
              'uniqueLookupKeys': 37391,
              'totalHeadwords': 23000,
              'nextBatch': 47,
              'ipaFallbackCount': len(fallback_words),
              'ipaFallbackWords': fallback_words,
              'lookupSha256': manifest['lookup']['sha256'],
              'partCounts': part_counts,
              'formsReviewed': True,
              'validation': {
                  'priorCollisions': 0,
                  'duplicateHeadwords': 0,
                  'badHeadwords': 0,
                  'badGlosses': 0
              }
          }
          (root / 'batch046_validation.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          # Remove temporary staging and this one-shot finalizer so the
          # repository returns to its clean steady state.
          shutil.rmtree(root / 'staging' / 'batch046')
          wf = root / '.github' / 'workflows' / 'finalize-batch046.yml'
          if wf.exists():
              wf.unlink()

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit Batch 046 atomically
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Add dictionary Batch 046'
          git push
