name: Finalize Dictionary Batch 028

on:
  push:
    paths:
      - 'staging/batch028/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install language helpers
        run: python -m pip install --quiet lemminflect eng-to-ipa
      - name: Assemble and validate Batch 028
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, zlib
          from lemminflect import getInflection
          import eng_to_ipa as e2i

          root=pathlib.Path('.')
          manifest_path=root/'dictionary_manifest.json'
          lookup_path=root/'lookup'/'used_keys_current.zlib.b64'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['latestBatch']==27 and manifest['nextBatch']==28
          assert manifest['batchCount']==27 and manifest['totalHeadwords']==13500
          assert manifest['lookup']['throughBatch']==27

          encoded=lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest()==manifest['lookup']['sha256']
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())
          assert len(prior)==manifest['lookup']['uniqueLookupKeys']==25849

          src=root/'staging'/'batch028'/'candidates_v2'
          rows=[]
          for i in range(1,11):
              for raw in (src/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines():
                  if raw.strip():
                      w,pos,freq,phones,definition=raw.split('\t',4)
                      rows.append({'word':w.strip(),'sourcePos':pos.strip(),'phones':phones.strip(),'definition':definition.strip()})
          denied=set('haired brent dell toby kris sonny dicks malik reps tabs ness jasper baba springer demographics erica milo veronica amelia dealings dolly kylie sawyer specs chevy rappers fellas haters legged marcel bodied raptors mater veggies bowman slater underwood mens wally flavored fuckers wrought dirk pharma blanc boomers bots deco amir greenwood sherry hobbit'.split())
          replacements='cleric directional divergent downright expansive fife infancy plainly rumour sixteenth spawn suffrage surrogate treatise waltz butch contour decidedly douche futuristic inclination inward launcher lessen lifespan longitudinal loosen masculinity midday morphine pelvic pigment racially saturation tart ting transformer centennial cosmopolitan deductible diagonal felicity fodder hump incest legitimately magically materially modernization noticeably overrun porno'.split()
          reserve={}
          for i in range(11,21):
              p=src/f'candidates_{i:02d}.tsv'
              if not p.exists(): continue
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if raw.strip():
                      w,pos,freq,phones,definition=raw.split('\t',4)
                      reserve[w.strip()]={'word':w.strip(),'sourcePos':pos.strip(),'phones':phones.strip(),'definition':definition.strip()}
          assert len(rows)==500 and len(denied)==52 and len(replacements)==52
          assert all(w in reserve for w in replacements)
          source=[r for r in rows if r['word'] not in denied]+[reserve[w] for w in replacements]
          words=[r['word'] for r in source]; headset=set(words); source_by={r['word']:r for r in source}
          assert len(source)==500 and len(headset)==500
          assert not (headset & prior)
          assert all(w.isascii() and w.isalpha() and w==w.lower() and '-' not in w for w in words)

          translations={}
          for p in sorted((root/'staging'/'batch028'/'translations').glob('*.tsv')):
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  parts=raw.strip().split('\t',2)
                  assert len(parts)==3, (p.name,raw)
                  w,pos,blob=(x.strip() for x in parts)
                  glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  assert w not in translations, w
                  translations[w]=(pos,glosses)
          assert len(translations)==500 and set(translations)==headset
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}
          latin=re.compile(r'[A-Za-z]')
          for w,(pos,g) in translations.items():
              assert pos in allowed and 1<=len(g)<=3
              assert all(x and not latin.search(x) for x in g), (w,g)

          def fallback_ipa(phones):
              cmap={'B':'b','CH':'tʃ','D':'d','DH':'ð','F':'f','G':'ɡ','HH':'h','JH':'dʒ','K':'k','L':'l','M':'m','N':'n','NG':'ŋ','P':'p','R':'r','S':'s','SH':'ʃ','T':'t','TH':'θ','V':'v','W':'w','Y':'j','Z':'z','ZH':'ʒ'}
              vmap={'AA':'ɑ','AE':'æ','AO':'ɔ','AW':'aʊ','AY':'aɪ','EH':'ɛ','EY':'eɪ','IH':'ɪ','IY':'i','OW':'oʊ','OY':'ɔɪ','UH':'ʊ','UW':'u'}
              out=[]
              for tok in phones.split():
                  m=re.match(r'^([A-Z]+)([012])?$',tok)
                  assert m, (phones,tok)
                  base=m.group(1); stress=m.group(2)
                  if base=='AH': sym='ə' if stress=='0' else 'ʌ'
                  elif base=='ER': sym='ɚ' if stress=='0' else 'ɝ'
                  elif base in vmap: sym=vmap[base]
                  else: sym=cmap[base]
                  if stress=='1' and base in set(vmap)|{'AH','ER'}: sym='ˈ'+sym
                  elif stress=='2' and base in set(vmap)|{'AH','ER'}: sym='ˌ'+sym
                  out.append(sym)
              return ''.join(out)

          used_forms=set(); entries=[]; fallback_words=[]
          for word in words:
              pos,glosses=translations[word]
              ipa=e2i.convert(word,stress_marks='both').strip()
              if not ipa or '*' in ipa or ipa.lower()==word.lower():
                  ipa=fallback_ipa(source_by[word]['phones']); fallback_words.append(word)
              ipa=ipa.replace('/','').strip()
              assert ipa and '*' not in ipa and '\n' not in ipa
              forms=[]
              if pos=='verb':
                  for tag in ('VBZ','VBD','VBN','VBG'):
                      for f in getInflection(word,tag=tag) or ():
                          f=f.lower().strip()
                          if not f or f==word or not f.isascii() or not f.isalpha(): continue
                          if f in prior or f in headset or f in used_forms or f in forms: continue
                          forms.append(f); used_forms.add(f)
              entries.append({'word':word,'pronunciation':f'/{ipa}/','forms':forms,'meanings':[{'partOfSpeech':pos,'burmese':glosses}]})

          assert len(entries)==500 and len({e['word'] for e in entries})==500
          new_forms=[f for e in entries for f in e['forms']]
          assert len(new_forms)==len(set(new_forms))
          assert not (set(new_forms)&prior) and not (set(new_forms)&headset)
          for e in entries:
              assert e['word'] not in e['forms'] and len(e['forms'])==len(set(e['forms']))
              assert e['pronunciation'].startswith('/') and e['pronunciation'].endswith('/') and len(e['pronunciation'])>2
              assert 1<=sum(len(m['burmese']) for m in e['meanings'])<=3

          out=root/'Batches'/'dictionary_batch_028.json'
          assert not out.exists(), 'Batch 028 already exists'
          out.write_text(json.dumps({'version':1,'batch':28,'entries':entries},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          all_keys=prior|headset|set(new_forms)
          lookup_plain=('\n'.join(sorted(all_keys))+'\n').encode('utf-8')
          lookup_encoded=base64.b64encode(zlib.compress(lookup_plain,9)).decode('ascii')
          lookup_path.write_text(lookup_encoded,encoding='ascii')

          manifest['latestBatch']=28; manifest['nextBatch']=29; manifest['batchCount']=28; manifest['totalHeadwords']=14000
          manifest['lookup']['throughBatch']=28
          manifest['lookup']['uniqueLookupKeys']=len(all_keys)
          manifest['lookup']['uniqueHeadwords']=14000
          manifest['lookup']['uniqueStoredForms']=manifest['lookup']['uniqueStoredForms']+len(new_forms)
          manifest['lookup']['sha256']=hashlib.sha256(lookup_encoded.encode('ascii')).hexdigest()
          manifest['batchFilenamePattern']='Batches/dictionary_batch_XXX.json'
          assert manifest['totalHeadwords']==manifest['batchCount']*500
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme_path=root/'README.md'
          readme=readme_path.read_text(encoding='utf-8')
          readme=re.sub(r'Batches 001–027 have been generated: \*\*13,500 unique headwords\*\*\.', 'Batches 001–028 have been generated: **14,000 unique headwords**.', readme)
          readme_path.write_text(readme,encoding='utf-8')

          report={'batch':28,'entries':500,'newForms':len(new_forms),'priorLookupKeys':len(prior),'uniqueLookupKeys':len(all_keys),'totalHeadwords':14000,'nextBatch':29,'ipaFallbackCount':len(fallback_words),'ipaFallbackWords':fallback_words,'lookupSha256':manifest['lookup']['sha256']}
          (root/'batch028_validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit Batch 028 atomically
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add Batches/dictionary_batch_028.json lookup/used_keys_current.zlib.b64 dictionary_manifest.json README.md batch028_validation.json
          git commit -m 'Add dictionary Batch 028'
          git push
