name: Freeze Batch 042 Selection

on:
  push:
    paths:
      - 'staging/batch042/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch042'/'candidates'
          rows=[]
          for i in range(1,45):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,11): first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('''mylar paye valois clorox mozambican sanhedrin thusly akkadian christmastime lpn praetorian stilton fortieth marsala northerner parsi pathan prolog shod cistercian dama domine jainism khalsa metis mongoloid ptolemaic satsuma abyssinian beaujolais carthaginian gatt kantian komi maroc peloponnesian sikhism celt billionth alsatian niner rima'''.split())
          replacements='''screwy scrubby seismology semiotic smugness spectrograph straightforwardly theatricality tormentor uneconomic unshaven washboard bratwurst brickyard buccal cheerfulness circumvention commode contravene couturier decriminalize dioxin docent dramatize dyad efflux epistolary eruptive excrete ferromagnetic fiefdom frictionless granule guanine headwind idler ignominy inequitable kerfuffle obtrusive photoelectric pileup'''.split()
          assert len(first)==500 and len(reject)==42 and len(replacements)==42
          first_words=[r.split('\t',1)[0] for r in first]
          assert reject <= set(first_words), sorted(reject-set(first_words))
          assert all(w in parsed for w in replacements)
          assert not (set(replacements)&set(first_words))
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(kept)==458 and len(final)==500 and len(set(words))==500
          (root/'staging'/'batch042'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch042'/'SELECTION_SUMMARY.txt').write_text('retained=458\nreplacements=42\nfinal=500\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch042/final_selection.tsv staging/batch042/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 042 selection'
          git push
