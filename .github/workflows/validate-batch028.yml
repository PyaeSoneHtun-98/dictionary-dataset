name: Validate Staged Batch 028

on:
  push:
    paths:
      - 'staging/batch028/VALIDATE'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate translation keys and glosses
        run: |
          python - <<'PY'
          import base64, json, pathlib, re, zlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'dictionary_manifest.json').read_text(encoding='utf-8'))
          assert manifest['latestBatch']==27 and manifest['nextBatch']==28
          encoded=(root/'lookup'/'used_keys_current.zlib.b64').read_text(encoding='ascii').strip()
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())
          assert len(prior)==25849

          src=root/'staging'/'batch028'/'candidates_v2'
          rows=[]
          for i in range(1,11):
              for raw in (src/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines():
                  if raw.strip(): rows.append(raw.split('\t',4))
          denied=set('haired brent dell toby kris sonny dicks malik reps tabs ness jasper baba springer demographics erica milo veronica amelia dealings dolly kylie sawyer specs chevy rappers fellas haters legged marcel bodied raptors mater veggies bowman slater underwood mens wally flavored fuckers wrought dirk pharma blanc boomers bots deco amir greenwood sherry hobbit'.split())
          replacements='cleric directional divergent downright expansive fife infancy plainly rumour sixteenth spawn suffrage surrogate treatise waltz butch contour decidedly douche futuristic inclination inward launcher lessen lifespan longitudinal loosen masculinity midday morphine pelvic pigment racially saturation tart ting transformer centennial cosmopolitan deductible diagonal felicity fodder hump incest legitimately magically materially modernization noticeably overrun porno'.split()
          reserve={}
          for i in range(11,21):
              p=src/f'candidates_{i:02d}.tsv'
              if not p.exists(): continue
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if raw.strip():
                      r=raw.split('\t',4); reserve[r[0]]=r
          final=[r for r in rows if r[0] not in denied]+[reserve[w] for w in replacements]
          words=[r[0] for r in final]; headset=set(words)
          assert len(words)==500 and len(headset)==500 and not (headset&prior)

          translations={}; malformed=[]; duplicates=[]
          for p in sorted((root/'staging'/'batch028'/'translations').glob('*.tsv')):
              for n,raw in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  if not raw.strip(): continue
                  parts=raw.strip().split('\t',2)
                  if len(parts)!=3:
                      malformed.append(f'{p.name}:{n}:{raw}'); continue
                  w,pos,blob=(x.strip() for x in parts)
                  glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  if w in translations: duplicates.append(w)
                  translations[w]=(pos,glosses)
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}
          latin=re.compile(r'[A-Za-z]')
          bad=[]
          for w,(pos,g) in translations.items():
              if pos not in allowed or not (1<=len(g)<=3) or any(not x or latin.search(x) for x in g): bad.append(w)
          report={
            'finalWords':len(words),'translations':len(translations),'malformed':malformed,'duplicates':duplicates,
            'missing':sorted(headset-set(translations)),'extra':sorted(set(translations)-headset),'badGlossOrPos':sorted(bad),
            'priorLookupKeys':len(prior)
          }
          out=root/'staging'/'batch028'/'TRANSLATION_VALIDATION.json'
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if malformed or duplicates or report['missing'] or report['extra'] or bad:
              raise SystemExit(2)
          PY
      - name: Commit validation report
        if: always()
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch028/TRANSLATION_VALIDATION.json || true
          git diff --cached --quiet || (git commit -m 'Validate Batch 028 translations' && git push)
