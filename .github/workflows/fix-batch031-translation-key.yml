name: Fix Batch 031 Translation Key

on:
  push:
    paths:
      - 'staging/batch031/FIX_TRANSLATION_KEY'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix graciously key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('staging/batch031/translations/part03.tsv')
          s=p.read_text(encoding='utf-8')
          assert 'gracously\t' in s and 'graciously\t' not in s
          p.write_text(s.replace('gracously\t','graciously\t'),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch031/translations/part03.tsv
          git commit -m 'Fix Batch 031 translation key'
          git push
