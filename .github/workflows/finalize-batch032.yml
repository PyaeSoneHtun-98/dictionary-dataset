name: Finalize Dictionary Batch 032

on:
  push:
    paths:
      - 'staging/batch032/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pronunciation helper
        run: python -m pip install --quiet eng-to-ipa
      - name: Assemble and validate Batch 032
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, shutil, zlib
          import eng_to_ipa as e2i
          root=pathlib.Path('.')
          manifest_path=root/'dictionary_manifest.json'; lookup_path=root/'lookup'/'used_keys_current.zlib.b64'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['latestBatch']==31 and manifest['nextBatch']==32
          assert manifest['batchCount']==31 and manifest['totalHeadwords']==15500
          assert manifest['lookup']['throughBatch']==31 and manifest['lookup']['uniqueLookupKeys']==28109
          assert manifest['lookup']['uniqueStoredForms']==12655
          assert manifest['lookup']['sha256']=='94ae95ef65c217ff1d5e2667198a53dd0036f92fda22b6172ede7a8ce7530882'
          encoded=lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest()==manifest['lookup']['sha256']
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines()); assert len(prior)==28109

          rows=[]
          for raw in (root/'staging/batch032/final_selection.tsv').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  w,pos,freq,phones,definition=raw.split('\t',4)
                  rows.append({'word':w.strip(),'sourcePos':pos.strip(),'phones':phones.strip(),'definition':definition.strip()})
          words=[r['word'] for r in rows]; headset=set(words); source_by={r['word']:r for r in rows}
          assert len(rows)==500 and len(headset)==500 and not (headset&prior)
          assert all(w.isascii() and w.isalpha() and w==w.lower() and ' ' not in w and '-' not in w for w in words)
          rejected=set('eros eskimo lombard looney medici mojave nepali westside cajun calvary sars whig chou bolshevik duma mongol sapiens singaporean kashmiri madeira oreo pisces scrooge uruguayan valhalla balboa falco inuit muscat rwandan aegean franciscan burundi'.split())
          assert not (headset&rejected) and 'remodel' in headset

          translations={}
          for p in sorted((root/'staging/batch032/translations').glob('part*.tsv')):
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  parts=raw.split('\t',2); assert len(parts)==3,(p.name,raw)
                  w,pos,blob=(x.strip() for x in parts)
                  glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  assert w not in translations,w
                  translations[w]=(pos,glosses)
          assert len(translations)==500 and set(translations)==headset
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}
          latin=re.compile(r'[A-Za-z]')
          for w,(pos,g) in translations.items():
              assert pos in allowed and 1<=len(g)<=3 and all(x and not latin.search(x) for x in g),(w,g)
          staged=json.loads((root/'staging/batch032/TRANSLATION_VALIDATION.json').read_text(encoding='utf-8'))
          assert staged['finalWords']==500 and staged['uniqueWords']==500 and staged['translations']==500
          assert not any(staged[k] for k in ['priorCollisions','malformed','duplicates','missing','extra','badGlossOrPos'])

          reviewed_forms={
            'normalize':['normalizes','normalized','normalizing'],
            'reread':['rereads','rereading'],
            'detach':['detaches','detaching'],
            'incarnate':['incarnates','incarnated','incarnating'],
            'nestle':['nestles','nestled','nestling'],
            'solidify':['solidifies','solidified','solidifying'],
            'stonewall':['stonewalls','stonewalled','stonewalling'],
            'flatten':['flattens','flattened','flattening'],
            'negate':['negates','negated','negating'],
            'outnumber':['outnumbers','outnumbered','outnumbering'],
            'parse':['parses','parsed','parsing'],
            'recoup':['recoups','recouped','recouping'],
            'pounce':['pounces','pounced','pouncing'],
            'scour':['scours','scoured','scouring'],
            'remodel':['remodels','remodeled','remodelled','remodeling','remodelling'],
            'cull':['culls','culled','culling'],
            'misread':['misreads','misreading'],
            'outrun':['outruns','outran','outrunning'],
            'profane':['profanes','profaned','profaning'],
            'reprise':['reprises','reprised','reprising'],
            'encode':['encodes','encoded','encoding'],
            'subvert':['subverts','subverted','subverting'],
            'profess':['professes','professed','professing'],
            'recast':['recasts','recasting'],
            'synthesize':['synthesizes','synthesized','synthesizing'],
            'wreak':['wreaks','wreaked','wreaking'],
            'hasten':['hastens','hastened','hastening'],
            'resell':['resells','resold','reselling'],
            'congregate':['congregates','congregated','congregating']
          }
          verb_words={w for w,(pos,_) in translations.items() if pos=='verb'}
          assert verb_words==set(reviewed_forms),(sorted(verb_words),sorted(reviewed_forms))
          dry=json.loads((root/'staging/batch032/ASSEMBLY_DRYRUN.json').read_text(encoding='utf-8'))
          assert dry['entries']==500 and dry['priorLookupKeys']==28109 and dry['verbCount']==29 and dry['proposedFormCount']==86
          assert 'recasted' in dry['verbForms']['recast'] and 'recasted' not in reviewed_forms['recast']
          all_forms=[f for w in words for f in reviewed_forms.get(w,[])]
          assert len(all_forms)==85 and len(set(all_forms))==85
          assert not (set(all_forms)&prior) and not (set(all_forms)&headset)
          assert all(f.isascii() and f.isalpha() and f==f.lower() for f in all_forms)

          def fallback_ipa(phones):
              cmap={'B':'b','CH':'tʃ','D':'d','DH':'ð','F':'f','G':'ɡ','HH':'h','JH':'dʒ','K':'k','L':'l','M':'m','N':'n','NG':'ŋ','P':'p','R':'r','S':'s','SH':'ʃ','T':'t','TH':'θ','V':'v','W':'w','Y':'j','Z':'z','ZH':'ʒ'}
              vmap={'AA':'ɑ','AE':'æ','AO':'ɔ','AW':'aʊ','AY':'aɪ','EH':'ɛ','EY':'eɪ','IH':'ɪ','IY':'i','OW':'oʊ','OY':'ɔɪ','UH':'ʊ','UW':'u'}; vowels=set(vmap)|{'AH','ER'}
              out=[]
              for tok in phones.split():
                  mm=re.match(r'^([A-Z]+)([012])?$',tok); assert mm,(phones,tok)
                  base,stress=mm.group(1),mm.group(2)
                  if base=='AH': sym='ə' if stress=='0' else 'ʌ'
                  elif base=='ER': sym='ɚ' if stress=='0' else 'ɝ'
                  elif base in vmap: sym=vmap[base]
                  else: sym=cmap[base]
                  if stress=='1' and base in vowels: sym='ˈ'+sym
                  elif stress=='2' and base in vowels: sym='ˌ'+sym
                  out.append(sym)
              return ''.join(out)

          entries=[]; fallback_words=[]
          for word in words:
              pos,glosses=translations[word]
              ipa=e2i.convert(word,stress_marks='both').strip()
              if not ipa or '*' in ipa or ipa.lower()==word.lower():
                  ipa=fallback_ipa(source_by[word]['phones']); fallback_words.append(word)
              ipa=ipa.replace('/','').strip(); assert ipa and '*' not in ipa and '\n' not in ipa
              entries.append({'word':word,'pronunciation':f'/{ipa}/','forms':list(reviewed_forms.get(word,[])),'meanings':[{'partOfSpeech':pos,'burmese':glosses}]})
          assert len(entries)==500 and len({e['word'] for e in entries})==500
          assert fallback_words==dry['ipaFallbackWords']
          assert fallback_words==['metastatic','synchronous','dielectric','eponymous','molar','neolithic','reflux','quadratic','recombination','solubility','wanker','ocular','somatic']
          for e in entries:
              assert e['word'] not in e['forms'] and len(e['forms'])==len(set(e['forms']))
              assert e['pronunciation'].startswith('/') and e['pronunciation'].endswith('/') and len(e['pronunciation'])>2
              assert 1<=sum(len(m['burmese']) for m in e['meanings'])<=3

          out=root/'Batches'/'dictionary_batch_032.json'; assert not out.exists()
          out.write_text(json.dumps({'version':1,'batch':32,'entries':entries},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          all_keys=prior|headset|set(all_forms); assert len(all_keys)==28109+500+85
          plain=('\n'.join(sorted(all_keys))+'\n').encode('utf-8')
          lookup_encoded=base64.b64encode(zlib.compress(plain,9)).decode('ascii'); lookup_path.write_text(lookup_encoded,encoding='ascii')

          manifest['latestBatch']=32; manifest['nextBatch']=33; manifest['batchCount']=32; manifest['totalHeadwords']=16000
          manifest['lookup']['throughBatch']=32; manifest['lookup']['uniqueLookupKeys']=len(all_keys); manifest['lookup']['uniqueHeadwords']=16000
          manifest['lookup']['uniqueStoredForms']=12655+len(all_forms); manifest['lookup']['sha256']=hashlib.sha256(lookup_encoded.encode('ascii')).hexdigest()
          assert manifest['totalHeadwords']==manifest['batchCount']*500
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme_path=root/'README.md'; readme=readme_path.read_text(encoding='utf-8')
          old='Batches 001–031 have been generated: **15,500 unique headwords**.'; new='Batches 001–032 have been generated: **16,000 unique headwords**.'
          assert old in readme; readme_path.write_text(readme.replace(old,new),encoding='utf-8')
          report={'batch':32,'entries':500,'newForms':len(all_forms),'priorLookupKeys':len(prior),'uniqueLookupKeys':len(all_keys),'totalHeadwords':16000,'nextBatch':33,'ipaFallbackCount':len(fallback_words),'ipaFallbackWords':fallback_words,'lookupSha256':manifest['lookup']['sha256'],'formsReviewed':True,'droppedProposedForms':['recasted']}
          (root/'batch032_validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          shutil.rmtree(root/'staging'/'batch032')
          for name in ['select-batch032.yml','freeze-batch032.yml','repair-batch032-selection.yml','validate-batch032.yml','dryrun-batch032.yml','finalize-batch032.yml']:
              p=root/'.github'/'workflows'/name
              if p.exists(): p.unlink()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit Batch 032 atomically
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Add dictionary Batch 032'
          git push
