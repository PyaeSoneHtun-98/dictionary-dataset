name: Dry Run Dictionary Batch 031

on:
  push:
    paths:
      - 'staging/batch031/DRYRUN'

permissions:
  contents: write

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install language helpers
        run: python -m pip install --quiet eng_to_ipa lemminflect
      - name: Dry-run IPA and forms
        run: |
          python - <<'PY'
          import base64, json, pathlib, re, zlib
          import eng_to_ipa as e2i
          from lemminflect import getInflection
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text())
          assert m['latestBatch']==30 and m['nextBatch']==31 and m['lookup']['uniqueLookupKeys']==27562
          enc=(root/'lookup/used_keys_current.zlib.b64').read_text().strip()
          prior=set(zlib.decompress(base64.b64decode(enc)).decode().splitlines())
          assert len(prior)==27562
          lines=[x for x in (root/'staging'/'batch031'/'final_selection.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          words=[x.split('\t',1)[0] for x in lines]; headset=set(words)
          assert len(words)==500 and len(headset)==500 and not (headset&prior)
          trans={}
          for p in sorted((root/'staging'/'batch031'/'translations').glob('part*.tsv')):
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  w,pos,g=line.split('\t')
                  trans[w]=(pos,g)
          assert set(trans)==headset
          fallback=[]; ipa={}
          for w in words:
              s=e2i.convert(w, retrieve_all=False, stress_marks='both')
              if not s or '*' in s:
                  fallback.append(w); ipa[w]=None
              else:
                  ipa[w]='/'+s.strip('/')+'/'
          verb_forms={}; used=set()
          for w in words:
              if trans[w][0] != 'verb': continue
              forms=[]
              for tag in ('VBZ','VBD','VBN','VBG'):
                  vals=getInflection(w,tag=tag) or ()
                  for f in vals:
                      f=f.lower().strip()
                      if not (f.isascii() and f.isalpha()) or f==w or f in prior or f in headset or f in used or f in forms: continue
                      forms.append(f); used.add(f)
              verb_forms[w]=forms
          report={
            'batch':31,
            'entries':len(words),
            'priorLookupKeys':len(prior),
            'ipaFallbackCount':len(fallback),
            'ipaFallbackWords':fallback,
            'verbCount':len(verb_forms),
            'proposedFormCount':sum(len(v) for v in verb_forms.values()),
            'verbForms':verb_forms
          }
          (root/'staging'/'batch031'/'ASSEMBLY_DRYRUN.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit dry-run report
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch031/ASSEMBLY_DRYRUN.json
          git commit -m 'Dry run Batch 031 assembly'
          git push
