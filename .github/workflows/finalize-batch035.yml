name: Finalize Dictionary Batch 035

on:
  push:
    paths:
      - 'staging/batch035/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pronunciation helper
        run: python -m pip install --quiet eng-to-ipa
      - name: Assemble and validate Batch 035
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, shutil, zlib
          import eng_to_ipa as e2i
          root=pathlib.Path('.')
          manifest_path=root/'dictionary_manifest.json'; lookup_path=root/'lookup'/'used_keys_current.zlib.b64'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['latestBatch']==34 and manifest['nextBatch']==35 and manifest['batchCount']==34 and manifest['totalHeadwords']==17000
          assert manifest['lookup']['throughBatch']==34 and manifest['lookup']['uniqueLookupKeys']==29859 and manifest['lookup']['uniqueStoredForms']==12905
          encoded=lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest()==manifest['lookup']['sha256']=='2ba0f5e6ee8d6f3e4abb969941613653905059491f58b131c602d551d7f7ccf9'
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines()); assert len(prior)==29859

          rows=[]
          for raw in (root/'staging/batch035/final_selection.tsv').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  w,pos,freq,phones,definition=raw.split('\t',4)
                  rows.append({'word':w.strip(),'sourcePos':pos.strip(),'phones':phones.strip(),'definition':definition.strip()})
          words=[r['word'] for r in rows]; headset=set(words); source_by={r['word']:r for r in rows}
          assert len(rows)==500 and len(headset)==500 and not (headset&prior)
          assert all(w.isascii() and w.isalpha() and w==w.lower() for w in words)

          translations={}
          for p in sorted((root/'staging/batch035/translations').glob('part*.tsv')):
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  w,pos,blob=(x.strip() for x in raw.split('\t',2))
                  glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  assert w not in translations,w
                  translations[w]=(pos,glosses)
          assert len(translations)==500 and set(translations)==headset
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}; latin=re.compile(r'[A-Za-z]')
          for w,(pos,g) in translations.items():
              assert pos in allowed and 1<=len(g)<=3 and all(x and not latin.search(x) for x in g),(w,pos,g)
          staged=json.loads((root/'staging/batch035/TRANSLATION_VALIDATION.json').read_text(encoding='utf-8'))
          assert staged['finalWords']==500 and staged['uniqueWords']==500 and staged['translations']==500
          assert not staged['priorCollisions'] and not staged['malformed'] and not staged['duplicates'] and not staged['missing'] and not staged['extra'] and not staged['badGlossOrPos']

          reviewed_forms={
            'narrate':['narrates','narrated','narrating'],
            'pare':['pares','pared','paring'],
            'scoot':['scoots','scooted','scooting'],
            'secede':['secedes','seceded','seceding'],
            'seep':['seeps','seeped','seeping'],
            'skyrocket':['skyrockets','skyrocketed','skyrocketing'],
            'colonize':['colonizes','colonized','colonizing'],
            'dally':['dallies','dallied','dallying'],
            'devolve':['devolves','devolved','devolving'],
            'dupe':['dupes','duped','duping'],
            'elongate':['elongates','elongated','elongating'],
            'pamper':['pampers','pampered','pampering'],
            'restock':['restocks','restocked','restocking'],
            'scoff':['scoffs','scoffed','scoffing'],
            'wham':['whams','whammed','whamming'],
            'enclose':['encloses','enclosing'],
            'magnify':['magnifies','magnified','magnifying'],
            'redistribute':['redistributes','redistributed','redistributing'],
            'straddle':['straddles','straddled','straddling'],
            'sweeten':['sweetens','sweetened','sweetening'],
            'bate':['bates','bated','bating'],
            'digress':['digresses','digressed','digressing'],
            'empathize':['empathizes','empathized','empathizing'],
            'energize':['energizes','energized','energizing'],
            'fester':['festers','festered','festering'],
            'peddle':['peddles','peddled','peddling'],
            'posit':['posits','posited','positing'],
            'reinstall':['reinstalls','reinstalled','reinstalling'],
            'clothe':['clothes','clothed','clothing'],
            'crump':['crumps','crumped','crumping'],
            'quash':['quashes','quashed','quashing'],
            'barf':['barfs','barfed','barfing'],
            'modulate':['modulates','modulated','modulating'],
            'penalize':['penalizes','penalized','penalizing'],
            'piggyback':['piggybacks','piggybacked','piggybacking'],
            'glean':['gleans','gleaned','gleaning'],
            'peruse':['peruses','perused','perusing'],
            'scorch':['scorches','scorched','scorching'],
            'scribble':['scribbles','scribbled','scribbling']
          }
          verb_words={w for w,(pos,_) in translations.items() if pos=='verb'}
          assert verb_words==set(reviewed_forms),(sorted(verb_words),sorted(reviewed_forms))
          dry=json.loads((root/'staging/batch035/ASSEMBLY_DRYRUN.json').read_text(encoding='utf-8'))
          assert dry['entries']==500 and dry['priorLookupKeys']==29859 and dry['verbCount']==39 and dry['proposedFormCount']==116
          assert dry['verbForms']==reviewed_forms
          all_forms=[f for w in words for f in reviewed_forms.get(w,[])]
          assert len(all_forms)==116 and len(set(all_forms))==116 and not (set(all_forms)&prior) and not (set(all_forms)&headset)

          def fallback_ipa(phones):
              cmap={'B':'b','CH':'tʃ','D':'d','DH':'ð','F':'f','G':'ɡ','HH':'h','JH':'dʒ','K':'k','L':'l','M':'m','N':'n','NG':'ŋ','P':'p','R':'r','S':'s','SH':'ʃ','T':'t','TH':'θ','V':'v','W':'w','Y':'j','Z':'z','ZH':'ʒ'}
              vmap={'AA':'ɑ','AE':'æ','AO':'ɔ','AW':'aʊ','AY':'aɪ','EH':'ɛ','EY':'eɪ','IH':'ɪ','IY':'i','OW':'oʊ','OY':'ɔɪ','UH':'ʊ','UW':'u'}
              vowels=set(vmap)|{'AH','ER'}; out=[]
              for tok in phones.split():
                  mm=re.match(r'^([A-Z]+)([012])?$',tok); assert mm,(phones,tok)
                  base,stress=mm.group(1),mm.group(2)
                  if base=='AH': sym='ə' if stress=='0' else 'ʌ'
                  elif base=='ER': sym='ɚ' if stress=='0' else 'ɝ'
                  elif base in vmap: sym=vmap[base]
                  else: sym=cmap[base]
                  if stress=='1' and base in vowels: sym='ˈ'+sym
                  elif stress=='2' and base in vowels: sym='ˌ'+sym
                  out.append(sym)
              return ''.join(out)

          entries=[]; fallback_words=[]
          for word in words:
              pos,glosses=translations[word]
              ipa=e2i.convert(word,stress_marks='both').strip()
              if not ipa or '*' in ipa or ipa.lower()==word.lower():
                  ipa=fallback_ipa(source_by[word]['phones']); fallback_words.append(word)
              ipa=ipa.replace('/','').strip(); assert ipa and '*' not in ipa and '\n' not in ipa
              forms=list(reviewed_forms.get(word,[]))
              entries.append({'word':word,'pronunciation':f'/{ipa}/','forms':forms,'meanings':[{'partOfSpeech':pos,'burmese':glosses}]})
          assert len(entries)==500 and len({e['word'] for e in entries})==500
          assert fallback_words==dry['ipaFallbackWords']
          assert fallback_words==['resection','wherefore','associative','interstitial','esophageal','sphincter','stratification','modulus','balsamic','epithelium']

          out=root/'Batches'/'dictionary_batch_035.json'; assert not out.exists(),'Batch 035 already exists'
          out.write_text(json.dumps({'version':1,'batch':35,'entries':entries},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          all_keys=prior|headset|set(all_forms); assert len(all_keys)==29859+500+116
          plain=('\n'.join(sorted(all_keys))+'\n').encode('utf-8')
          lookup_encoded=base64.b64encode(zlib.compress(plain,9)).decode('ascii'); lookup_path.write_text(lookup_encoded,encoding='ascii')
          manifest['latestBatch']=35; manifest['nextBatch']=36; manifest['batchCount']=35; manifest['totalHeadwords']=17500
          manifest['lookup']['throughBatch']=35; manifest['lookup']['uniqueLookupKeys']=len(all_keys); manifest['lookup']['uniqueHeadwords']=17500; manifest['lookup']['uniqueStoredForms']=12905+116; manifest['lookup']['sha256']=hashlib.sha256(lookup_encoded.encode('ascii')).hexdigest()
          assert manifest['totalHeadwords']==manifest['batchCount']*500
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rp=root/'README.md'; text=rp.read_text(encoding='utf-8'); old='Batches 001–034 have been generated: **17,000 unique headwords**.'; new='Batches 001–035 have been generated: **17,500 unique headwords**.'; assert old in text; rp.write_text(text.replace(old,new),encoding='utf-8')
          report={'batch':35,'entries':500,'newForms':116,'priorLookupKeys':29859,'uniqueLookupKeys':len(all_keys),'totalHeadwords':17500,'nextBatch':36,'ipaFallbackCount':len(fallback_words),'ipaFallbackWords':fallback_words,'lookupSha256':manifest['lookup']['sha256'],'formsReviewed':True}
          (root/'batch035_validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          shutil.rmtree(root/'staging'/'batch035')
          for name in ['select-batch035.yml','freeze-batch035.yml','normalize-batch035-translations.yml','validate-batch035.yml','dryrun-batch035.yml','finalize-batch035.yml']:
              p=root/'.github'/'workflows'/name
              if p.exists(): p.unlink()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit Batch 035 atomically
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Add dictionary Batch 035'
          git push