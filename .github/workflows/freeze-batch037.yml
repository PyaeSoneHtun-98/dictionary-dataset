name: Freeze Batch 037 Selection

on:
  push:
    paths:
      - 'staging/batch037/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch037'/'candidates'
          rows=[]
          for i in range(1,29):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,11):
              first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('''hewn masa romani sirs turkic algonquin farsi iras iver kodiak slav solon tans wags ailes etna fulani masai minutiae vela wedgwood calvinist elaborates generics hoosier lhasa ohms reit tics angolan awed balmoral cyrillic silesia superfund tabasco esperanto goldilocks gorgon hutu lisle luger obscures tutsi aced confucianism exudes gargantuan frankfurter'''.split())
          replacements='''facile fatherless fittingly gizmo glycine goop groggy guano homogeneity huntress idiopathic immigrate implacable indiscretion infirm jailer kerb lengthwise materialist monger narc necromancer nitride notional obverse offstage palatial paucity peculiarly pelagic phenomenally phonics physiologically pithy plop preclinical raster reassessment registrant repaint resurgent rubbery sceptre seditious serviceman statuette swig taxidermy thankless'''.split()
          assert len(first)==500
          assert len(reject)==49 and len(replacements)==49
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          assert len(kept)==451,len(kept)
          assert all(w in parsed for w in replacements)
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(final)==500 and len(set(words))==500
          assert not (set(words)&reject)
          (root/'staging'/'batch037'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch037'/'SELECTION_SUMMARY.txt').write_text(f'kept={len(kept)}\nreplacements={len(replacements)}\nfinal={len(final)}\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch037/final_selection.tsv staging/batch037/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 037 selection'
          git push
