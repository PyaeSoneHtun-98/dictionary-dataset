name: Dry Run Dictionary Batch 041

on:
  push:
    paths:
      - 'staging/batch041/DRYRUN'

permissions:
  contents: write

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install language helpers
        run: python -m pip install --quiet eng-to-ipa lemminflect
      - name: Dry-run IPA and forms
        run: |
          python - <<'PY'
          import base64, json, pathlib, zlib
          import eng_to_ipa as e2i
          from lemminflect import getInflection
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text())
          assert m['latestBatch']==40 and m['nextBatch']==41 and m['lookup']['uniqueLookupKeys']==33591
          prior=set(zlib.decompress(base64.b64decode((root/'lookup/used_keys_current.zlib.b64').read_text().strip())).decode().splitlines())
          assert len(prior)==33591
          lines=[x for x in (root/'staging/batch041/final_selection.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          words=[x.split('\t',1)[0].strip() for x in lines]; headset=set(words)
          assert len(words)==500 and len(headset)==500 and not (headset&prior)
          trans={}
          for p in sorted((root/'staging/batch041/translations').glob('part*.tsv')):
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      w,pos,g=(x.strip() for x in line.split('\t',2)); trans[w]=(pos,g)
          assert set(trans)==headset
          fallback=[]
          for w in words:
              s=e2i.convert(w,retrieve_all=False,stress_marks='both')
              if not s or '*' in s or s.lower()==w.lower(): fallback.append(w)
          verb_forms={}; used=set()
          for w in words:
              if trans[w][0]!='verb': continue
              forms=[]
              for tag in ('VBZ','VBD','VBN','VBG'):
                  for f in (getInflection(w,tag=tag) or ()):
                      f=f.lower().strip()
                      if not (f.isascii() and f.isalpha()) or f==w or f in prior or f in headset or f in used or f in forms: continue
                      forms.append(f); used.add(f)
              verb_forms[w]=forms
          report={'batch':41,'entries':500,'priorLookupKeys':len(prior),'ipaFallbackCount':len(fallback),'ipaFallbackWords':fallback,'verbCount':len(verb_forms),'proposedFormCount':sum(len(v) for v in verb_forms.values()),'verbForms':verb_forms}
          (root/'staging/batch041/ASSEMBLY_DRYRUN.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit dry-run report
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch041/ASSEMBLY_DRYRUN.json
          git commit -m 'Dry run Batch 041 assembly'
          git push
