name: Freeze Batch 030 Selection

on:
  push:
    paths:
      - 'staging/batch030/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          src=root/'staging'/'batch030'/'candidates'
          rows=[]
          for i in range(1,11):
              for raw in (src/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines():
                  if raw.strip():
                      rows.append(raw)
          assert len(rows)==500
          denied=set('basque bums cicero passover sewn texan xanax ers furthest gyms hogs pom teas telugu mol awoke cid dons goliath interpol opec quaker slavic zimmer chairmen dunkirk himalayan nafta puns mohawk saratoga tay yemeni cfo coates congressmen focussed macon porte acer lat shetland templar zoos bangladeshi californian dobson mcintosh midwestern overgrown qing serb sera sprang ams botox cyclops dahl gestapo hereford mayan sicilian sous yoruba aztec estonian macintosh medusa peed pullman raps'.split())
          replacements='rouse sampler scant schoolgirl sedimentary semblance sheik sine slowdown solstice sparsely spindle sterilization subtract supermodel susceptibility syphilis tactile tangle thermodynamics undercut unfriendly aloha anthropological avenger baseless beater blackness boyhood chronically deduct diminutive dispensary doubtless exclamation expressway gait genitalia grime heyday hospitalization impart indulgent irradiation leviathan lonesome lug lukewarm lumbar mismanagement multiculturalism nuance oftentimes pane penultimate percentile placenta pleasurable propagate redefine reinstate remit resumption retrograde reunification romantically rout soybean stardom steamy stopper'.split()
          assert len(denied)==71 and len(replacements)==71
          reserve={}
          for i in range(11,19):
              p=src/f'candidates_{i:02d}.tsv'
              if not p.exists(): continue
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if raw.strip(): reserve[raw.split('\t',1)[0]]=raw
          assert all(w in reserve for w in replacements), [w for w in replacements if w not in reserve]
          final=[r for r in rows if r.split('\t',1)[0] not in denied]+[reserve[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(final)==500 and len(set(words))==500
          out=root/'staging'/'batch030'/'final_selection.tsv'
          out.write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch030'/'SELECTION_SUMMARY.txt').write_text(f'retained={500-len(denied)}\nreplacements={len(replacements)}\nfinal={len(final)}\nfirst={words[0]}\nlast={words[-1]}\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch030/final_selection.tsv staging/batch030/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 030 selection'
          git push
