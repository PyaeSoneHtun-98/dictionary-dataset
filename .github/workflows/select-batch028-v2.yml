name: Select Batch 028 Candidates V2

on:
  push:
    paths:
      - 'staging/batch028/SELECT_V2'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lexical resources
        run: |
          python -m pip install --quiet wordfreq nltk lemminflect cmudict
          python - <<'PY'
          import nltk
          nltk.download('wordnet', quiet=True)
          PY
      - name: Build cleaner candidate pool
        run: |
          python - <<'PY'
          import base64, json, pathlib, re, zlib
          from wordfreq import top_n_list, zipf_frequency
          from nltk.corpus import wordnet as wn
          from lemminflect import getAllLemmas
          import cmudict

          root=pathlib.Path('.')
          manifest=json.loads((root/'dictionary_manifest.json').read_text(encoding='utf-8'))
          assert manifest['latestBatch']==27 and manifest['nextBatch']==28
          encoded=(root/'lookup'/'used_keys_current.zlib.b64').read_text(encoding='ascii').strip()
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())
          assert len(prior)==25849
          cmu=cmudict.dict()
          basic=set('the and is are was were be been being a an to of in on at for from with without by as or but if then than this that these those i you he she it we they me him her us them my your his its our their mine yours ours theirs yes no hello good bad okay ok maybe very really just only also now there here have has had do does did get got make made know think want need like love time year day people person thing things one two three four five first last most much many more less little big small new old right wrong well too before after why who what when where how can could would should will shall may might must adult edition healthy extremely indeed apart gift dear horse stick beauty edge forever blog sport afternoon flat mail pair proper quarter upper anywhere fantastic hundred joint museum rain warm suit native originally supreme user yellow exercise planet soft sugar entry golden pool hole pack cute numerous properly besides chicken meat mode zero cream giant kingdom theme unfortunately usual alcohol medium unable wing newspaper reserve dollar gender instance mile universe flag cheese diet item parent tight weekly tool attend circle concert noise panel somewhat worldwide bike cake peak portion ultimate fantasy paint pink theatre comedy defence plastic semi shoulder colour inch tone topic auto guitar pocket audio everyday extent killer lesson mount thin fort math photography legend mini rank helpful naked rear afterwards alright belt comic newly racist sexy suck aspect sheet string forum reverse seed regard strip tube breast exit luxury instant reader teen ongoing purple underground mouse piano symbol cape slide loop bass dual globe parallel classical clip menu powder export grandfather graphic outdoor ultra folk dish holder nonsense wealthy developer poster uncomfortable grid identification metro suite beloved icon vertical grandmother hurry plug disc iconic jewelry reminder unfortunate babe canon generic grandma handful happily nowadays throne nutrition rental unlimited cafe meter cartoon glorious micro toll trainer unbelievable underneath nationwide nest optical supporter adorable compact demo halfway unhappy bout comeback majesty penis shooter someday static backwards meantime recreation shitty buyer navigation sentiment liar pending subscribe utterly disk insert massage seller stark upside void whip wipe jerk kindly nude cluster dancer goddamn sore weigh cart hardcore portable succession sweep countless offence preview rapper toast tricky wreck documentation quarterback anal dull neighbourhood postal risky vibe desktop dial revival thankful heroin luckily recognise tenth coordinator meme terribly toss transgender champ ditch dope unemployed bastard fond specialty haul header node pointless sadness shiny undoubtedly extensively repeal rubbish uncommon upstairs congressman dough fictional fringe judgement legion mindset thrust builder feminism secondly spit heroic paperwork tasty afterward shave sickness zoom scent worthless masterpiece spoil temper eternity explode font grandpa hairy ounce performer predominantly righteous thankfully unpleasant unrelated loudly pitcher stall trillion bodily traction bravo immortal literal maternal softly theological duchess heavenly mentality metre newsletter reckon rover stainless turf twitch armour conception deed dwarf flagship internally maths mesh noticeable remotely specification splendid unsure upwards comfortably exceptionally homosexuality jewellery overweight palette policeman psycho rainy singular systemic unchanged understandable firstly flavour longtime null regain solitary stoke unpaid deluxe downstairs hulk insanity knot philosopher thrill disadvantage lump masculine outdoors respectable routinely salute scum vogue wildly creed hustle pottery prank aide chalk councillor entirety flock footballer hemisphere lastly neighbour persona realism scrub shale sophomore tinder countdown investigative obese perimeter sushi turnout commercially gladly honourable irresponsible rant apologise crunch'.split())
          short_allow=set('bra tub hut nap tee gal bot amp wan van cap pad jar lip rib hip fur ash axe arc orb vet spy foe ram dam gem mug pan pin pit pot rug tag web wig'.split())
          banned_def=[
            'native or inhabitant','official language','language spoken','a member of a catholic','adherent of protestantism',
            '(trademark)','street name for','genus of','family of','dynasty that ruled','federal department','federation of',
            'title for the former','basic unit of money','monetary unit','unit of pressure','unit of electric current','liquid unit equal',
            'a native of','ethnic slur','offensive term for a person of','country or region','nationality'
          ]
          posmap={wn.NOUN:'noun',wn.VERB:'verb',wn.ADJ:'adjective',wn.ADV:'adverb'}

          def canonical(w):
              if w in prior or w in basic or not (w.isascii() and w.isalpha() and w==w.lower()) or len(w)>18: return False
              if len(w)<=3 and w not in short_allow: return False
              lemmas=getAllLemmas(w, upos=None)
              bases={x.lower() for vals in lemmas.values() for x in vals}
              if any(b!=w and b.isalpha() for b in bases): return False
              syns=wn.synsets(w)
              if not syns: return False
              if any(s.instance_hypernyms() for s in syns): return False
              # Reject entries whose lexical lemmas reveal capitalization/proper-name status.
              if any(any(l.name()[:1].isupper() for l in s.lemmas()) for s in syns): return False
              defs=' || '.join(s.definition().lower() for s in syns[:5])
              if any(x in defs for x in banned_def): return False
              return True

          rows=[]; seen=set()
          for w in top_n_list('en',120000):
              w=w.lower().strip()
              if w in seen or not canonical(w): continue
              f=zipf_frequency(w,'en')
              if not (2.70<=f<=3.70): continue
              syns=wn.synsets(w)
              s=next((x for x in syns if x.pos() in posmap),None)
              if not s: continue
              phones=' '.join(cmu.get(w,[[]])[0])
              if not phones: continue
              rows.append((w,posmap[s.pos()],f,phones,s.definition().replace('\t',' ').replace('\n',' ')))
              seen.add(w)
              if len(rows)>=1000: break
          assert len(rows)>=850, len(rows)
          out=root/'staging'/'batch028'/'candidates_v2'; out.mkdir(parents=True,exist_ok=True)
          for i in range(0,len(rows),50):
              ch=rows[i:i+50]
              (out/f'candidates_{i//50+1:02d}.tsv').write_text('\n'.join(f'{w}\t{p}\t{f:.2f}\t{ph}\t{d}' for w,p,f,ph,d in ch)+'\n',encoding='utf-8')
          (out/'SUMMARY.json').write_text(json.dumps({'count':len(rows),'priorKeys':len(prior),'first':rows[0][0],'last':rows[-1][0]},indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit candidates
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch028/candidates_v2
          git commit -m 'Stage cleaner Batch 028 candidate pool'
          git push
