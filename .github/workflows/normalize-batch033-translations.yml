name: Normalize Batch 033 Translations

on:
  push:
    paths:
      - 'staging/batch033/NORMALIZE'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize translation TSV files
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path('staging/batch033/translations')
          total=0
          for p in sorted(d.glob('part*.tsv')):
              s=p.read_text(encoding='utf-8')
              s=s.replace('\\ nthoroughfare\t','\nthoroughfare\t')
              out=[]
              for raw in s.splitlines():
                  if not raw.strip(): continue
                  parts=[x.strip() for x in raw.strip().split('\t')]
                  assert len(parts)==3,(p.name,raw,parts)
                  w,pos,g=parts
                  assert w and pos and g
                  out.append('\t'.join((w,pos,g)))
              p.write_text('\n'.join(out)+'\n',encoding='utf-8')
              total+=len(out)
          assert total==500,total
          PY
      - name: Commit normalized translations
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch033/translations
          git commit -m 'Normalize Batch 033 translations'
          git push
