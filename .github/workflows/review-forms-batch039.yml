name: Review Batch 039 Forms

on:
  push:
    paths:
      - 'staging/batch039/FORMS'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze manually reviewed forms
        run: |
          python - <<'PY'
          import base64, json, pathlib, zlib
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text())
          assert m['latestBatch']==38 and m['nextBatch']==39 and m['lookup']['uniqueLookupKeys']==32348
          prior=set(zlib.decompress(base64.b64decode((root/'lookup/used_keys_current.zlib.b64').read_text().strip())).decode().splitlines())
          assert len(prior)==32348
          sel=[x for x in (root/'staging/batch039/final_selection.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          headset={x.split('\t',1)[0].strip() for x in sel}; assert len(headset)==500
          dry=json.loads((root/'staging/batch039/ASSEMBLY_DRYRUN.json').read_text(encoding='utf-8'))
          assert dry['batch']==39 and dry['verbCount']==33 and dry['proposedFormCount']==98
          forms={k:list(v) for k,v in dry['verbForms'].items()}
          # Explicitly reviewed irregular/collision-sensitive maps.
          assert forms['underwrite']==['underwrites','underwrote','underwritten','underwriting']
          assert forms['outshine']==['outshines','outshone','outshining']
          assert forms['headquarter']==['headquartered','headquartering']
          assert forms['localize']==['localizes','localizing']
          flat=[]
          for w,vals in forms.items():
              assert w in headset and len(vals)==len(set(vals))
              for f in vals:
                  assert f.isascii() and f.isalpha() and f==f.lower()
                  assert f!=w and f not in prior and f not in headset
                  flat.append(f)
          assert len(flat)==98 and len(set(flat))==98
          report={'batch':39,'verbCount':len(forms),'reviewedFormCount':len(flat),'corrections':{},'verbForms':forms,'formsReviewed':True}
          (root/'staging/batch039/REVIEWED_FORMS.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'verbCount':len(forms),'reviewedFormCount':len(flat)},indent=2))
          PY
      - name: Commit reviewed forms
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch039/REVIEWED_FORMS.json
          git commit -m 'Review Batch 039 forms'
          git push
