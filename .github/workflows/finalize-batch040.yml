name: Finalize Dictionary Batch 040

on:
  push:
    paths:
      - 'staging/batch040/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pronunciation helper
        run: python -m pip install --quiet eng-to-ipa
      - name: Assemble and validate Batch 040
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, shutil, zlib
          import eng_to_ipa as e2i
          root=pathlib.Path('.')
          manifest_path=root/'dictionary_manifest.json'; lookup_path=root/'lookup'/'used_keys_current.zlib.b64'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['latestBatch']==39 and manifest['nextBatch']==40 and manifest['batchCount']==39 and manifest['totalHeadwords']==19500
          assert manifest['lookup']['throughBatch']==39 and manifest['lookup']['uniqueLookupKeys']==32946 and manifest['lookup']['uniqueHeadwords']==19500 and manifest['lookup']['uniqueStoredForms']==13492
          encoded=lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest()==manifest['lookup']['sha256']=='08e1d114cb57c69ea265ce5b8c9408dcede1912136b9b396c6d7c46228961b14'
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines()); assert len(prior)==32946

          rows=[]
          for raw in (root/'staging/batch040/final_selection.tsv').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  w,pos,freq,phones,definition=raw.split('\t',4)
                  rows.append({'word':w.strip(),'sourcePos':pos.strip(),'phones':phones.strip(),'definition':definition.strip()})
          words=[r['word'] for r in rows]; headset=set(words); source_by={r['word']:r for r in rows}
          assert len(rows)==500 and len(headset)==500 and not (headset&prior)
          assert all(w.isascii() and w.isalpha() and w==w.lower() for w in words)

          translations={}
          for p in sorted((root/'staging/batch040/translations').glob('part*.tsv')):
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  w,pos,blob=(x.strip() for x in raw.split('\t',2))
                  glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  assert w not in translations,w
                  translations[w]=(pos,glosses)
          assert len(translations)==500 and set(translations)==headset
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}; latin=re.compile(r'[A-Za-z]')
          for w,(pos,g) in translations.items():
              assert pos in allowed and 1<=len(g)<=3 and all(x and not latin.search(x) for x in g),(w,pos,g)

          staged=json.loads((root/'staging/batch040/TRANSLATION_VALIDATION.json').read_text(encoding='utf-8'))
          assert staged['batch']==40 and staged['finalWords']==500 and staged['uniqueWords']==500 and staged['translations']==500
          assert staged['partCounts']=={'part01.tsv':100,'part02.tsv':100,'part03.tsv':100,'part04.tsv':100,'part05.tsv':100}
          assert staged['priorLookupKeys']==32946 and staged['selectionReview']=={'retained':447,'replacements':53}
          assert not staged['priorCollisions'] and not staged['malformed'] and not staged['duplicates'] and not staged['missing'] and not staged['extra'] and not staged['badGlossOrPos']

          reviewed=json.loads((root/'staging/batch040/REVIEWED_FORMS.json').read_text(encoding='utf-8'))
          expected_corrections={'envelop':{'removed':['envelopped','envelopping'],'kept':['envelops','enveloped','enveloping']}}
          assert reviewed['batch']==40 and reviewed['verbCount']==48 and reviewed['reviewedFormCount']==145 and reviewed['formsReviewed'] is True
          assert reviewed['corrections']==expected_corrections
          reviewed_forms=reviewed['verbForms']
          verb_words={w for w,(pos,_) in translations.items() if pos=='verb'}
          assert verb_words==set(reviewed_forms),(sorted(verb_words),sorted(reviewed_forms))
          assert reviewed_forms['envelop']==['envelops','enveloped','enveloping']
          assert reviewed_forms['overwrite']==['overwrites','overwrote','overwritten','overwriting']
          assert reviewed_forms['belie']==['belies','belied','belying']
          assert reviewed_forms['tarry']==['tarries','tarried','tarrying']
          all_forms=[f for w in words for f in reviewed_forms.get(w,[])]
          assert len(all_forms)==145 and len(set(all_forms))==145 and not (set(all_forms)&prior) and not (set(all_forms)&headset)

          dry=json.loads((root/'staging/batch040/ASSEMBLY_DRYRUN.json').read_text(encoding='utf-8'))
          expected_fallback=['neigh','satiety','psychopathology','bibliographical','marzipan','preoperative','adrenergic','amide','gerbil','physiologic','radiographic','lymphoid']
          assert dry['entries']==500 and dry['priorLookupKeys']==32946 and dry['verbCount']==48 and dry['proposedFormCount']==147
          assert dry['ipaFallbackWords']==expected_fallback and dry['ipaFallbackCount']==12

          def fallback_ipa(phones):
              cmap={'B':'b','CH':'tʃ','D':'d','DH':'ð','F':'f','G':'ɡ','HH':'h','JH':'dʒ','K':'k','L':'l','M':'m','N':'n','NG':'ŋ','P':'p','R':'r','S':'s','SH':'ʃ','T':'t','TH':'θ','V':'v','W':'w','Y':'j','Z':'z','ZH':'ʒ'}
              vmap={'AA':'ɑ','AE':'æ','AO':'ɔ','AW':'aʊ','AY':'aɪ','EH':'ɛ','EY':'eɪ','IH':'ɪ','IY':'i','OW':'oʊ','OY':'ɔɪ','UH':'ʊ','UW':'u'}
              vowels=set(vmap)|{'AH','ER'}; out=[]
              for tok in phones.split():
                  mm=re.match(r'^([A-Z]+)([012])?$',tok); assert mm,(phones,tok)
                  base,stress=mm.group(1),mm.group(2)
                  if base=='AH': sym='ə' if stress=='0' else 'ʌ'
                  elif base=='ER': sym='ɚ' if stress=='0' else 'ɝ'
                  elif base in vmap: sym=vmap[base]
                  else: sym=cmap[base]
                  if stress=='1' and base in vowels: sym='ˈ'+sym
                  elif stress=='2' and base in vowels: sym='ˌ'+sym
                  out.append(sym)
              return ''.join(out)

          entries=[]; fallback_words=[]
          for word in words:
              pos,glosses=translations[word]
              ipa=e2i.convert(word,stress_marks='both').strip()
              if not ipa or '*' in ipa or ipa.lower()==word.lower():
                  ipa=fallback_ipa(source_by[word]['phones']); fallback_words.append(word)
              ipa=ipa.replace('/','').strip(); assert ipa and '*' not in ipa and '\n' not in ipa
              entries.append({'word':word,'pronunciation':f'/{ipa}/','forms':list(reviewed_forms.get(word,[])),'meanings':[{'partOfSpeech':pos,'burmese':glosses}]})
          assert len(entries)==500 and len({e['word'] for e in entries})==500
          assert fallback_words==expected_fallback
          for e in entries:
              assert e['pronunciation'].startswith('/') and e['pronunciation'].endswith('/') and len(e['pronunciation'])>2
              assert e['forms']==list(dict.fromkeys(e['forms']))
              assert all(f!=e['word'] and f not in prior and f not in headset for f in e['forms'])
              assert len(e['meanings'])==1 and e['meanings'][0]['partOfSpeech'] in allowed
              assert 1<=len(e['meanings'][0]['burmese'])<=3 and all(not latin.search(g) for g in e['meanings'][0]['burmese'])

          out=root/'Batches'/'dictionary_batch_040.json'; assert not out.exists(),'Batch 040 already exists'
          out.write_text(json.dumps({'version':1,'batch':40,'entries':entries},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          all_keys=prior|headset|set(all_forms); assert len(all_keys)==32946+500+145==33591
          plain=('\n'.join(sorted(all_keys))+'\n').encode('utf-8')
          lookup_encoded=base64.b64encode(zlib.compress(plain,9)).decode('ascii'); lookup_path.write_text(lookup_encoded,encoding='ascii')
          manifest['latestBatch']=40; manifest['nextBatch']=41; manifest['batchCount']=40; manifest['totalHeadwords']=20000
          manifest['lookup']['throughBatch']=40; manifest['lookup']['uniqueLookupKeys']=len(all_keys); manifest['lookup']['uniqueHeadwords']=20000; manifest['lookup']['uniqueStoredForms']=13492+145; manifest['lookup']['sha256']=hashlib.sha256(lookup_encoded.encode('ascii')).hexdigest()
          assert manifest['totalHeadwords']==manifest['batchCount']*500
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          rp=root/'README.md'; text=rp.read_text(encoding='utf-8')
          old='Batches 001–039 have been generated: **19,500 unique headwords**.'; new='Batches 001–040 have been generated: **20,000 unique headwords**.'
          assert old in text; rp.write_text(text.replace(old,new),encoding='utf-8')
          report={'batch':40,'entries':500,'newForms':145,'priorLookupKeys':32946,'uniqueLookupKeys':len(all_keys),'totalHeadwords':20000,'nextBatch':41,'ipaFallbackCount':len(fallback_words),'ipaFallbackWords':fallback_words,'lookupSha256':manifest['lookup']['sha256'],'formsReviewed':True,'selectionReview':{'retained':447,'replacements':53},'formCorrections':expected_corrections}
          (root/'batch040_validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          shutil.rmtree(root/'staging'/'batch040')
          for name in ['select-batch040.yml','freeze-batch040.yml','normalize-batch040-translations.yml','validate-batch040.yml','dryrun-batch040.yml','review-forms-batch040.yml','finalize-batch040.yml']:
              p=root/'.github'/'workflows'/name
              if p.exists(): p.unlink()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit Batch 040 atomically
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Add dictionary Batch 040'
          git push
