name: Normalize Batch 034 Translations

on:
  push:
    paths:
      - 'staging/batch034/NORMALIZE'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize translation TSV files
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path('staging/batch034/translations')
          count=0
          for p in sorted(d.glob('part*.tsv')):
              rows=[]
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  parts=raw.split('\t')
                  assert len(parts)==3,(p,raw)
                  w,pos,g=(x.strip() for x in parts)
                  rows.append(f'{w}\t{pos}\t{g}')
              count += len(rows)
              p.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          assert count==500,count
          PY
      - name: Commit normalized translations
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch034/translations
          git diff --cached --quiet || git commit -m 'Normalize Batch 034 translations'
          git push
