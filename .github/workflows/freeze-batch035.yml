name: Freeze Batch 035 Selection

on:
  push:
    paths:
      - 'staging/batch035/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch035'/'candidates'
          rows=[]
          for i in range(1,25):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,11):
              first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('pentecostal sodom hellenic hellenistic landau gaba holstein malacca usmc organics pease pounder triassic hausa hawes overlaid parkes pews thickens urls adrenalin cockney darpa firs formulae knesset sputnik stanhope agua airforce becket chippewa gallic hanukkah israelite stalinist stank twos atticus azerbaijani debs deepens hallows mormonism neapolitan sind styrofoam teutonic benedictine cochin coos fora jewry romantics sacs shona tajik beaux'.split())
          replacements='capo commonality congratulation congratulatory continuance countrywide crony deadwood deceleration developmentally dint duffel emcee ergonomic especial feller fireside fugue glandular glean gutsy hydroxy impersonator intricately inwardly italic loveless lurid mesquite misnomer mournful mullah ontological paraffin periodontal peruse phenomenology pointedly psychotherapist rigidly scorch scribble searchlight singly stiletto stipe stooge strep tangential toga transference trill twisty universality unsteady voluptuous weevil alumina'.split()
          assert len(reject)==58 and len(replacements)==58
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          assert len(kept)==442,len(kept)
          assert all(w in parsed for w in replacements)
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(final)==500 and len(set(words))==500
          assert not (set(words)&reject)
          (root/'staging'/'batch035'/'final_selection.tsv').write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch035'/'SELECTION_SUMMARY.txt').write_text(f'kept={len(kept)}\nreplacements={len(replacements)}\nfinal={len(final)}\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch035/final_selection.tsv staging/batch035/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 035 selection'
          git push