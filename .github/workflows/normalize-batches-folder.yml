name: Normalize Batches Folder

on:
  push:
    paths:
      - 'staging_normalize_batches_ready'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move generated batches into existing Batches folder
        run: |
          set -e
          mkdir -p Batches
          test -f batches/dictionary_batch_024.json
          test -f batches/dictionary_batch_025.json
          mv batches/dictionary_batch_024.json Batches/dictionary_batch_024.json
          mv batches/dictionary_batch_025.json Batches/dictionary_batch_025.json
          rm -f batches/README.md
          rmdir batches || true
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('dictionary_manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          m['batchFilenamePattern'] = 'Batches/dictionary_batch_XXX.json'
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for name in ['AGENTS.md', 'README.md']:
              q = pathlib.Path(name)
              s = q.read_text(encoding='utf-8')
              s = s.replace('batches/dictionary_batch_XXX.json', 'Batches/dictionary_batch_XXX.json')
              s = s.replace('batches/                      generated batch JSON files', 'Batches/                      generated batch JSON files')
              s = s.replace('under `batches/`', 'under `Batches/`')
              q.write_text(s, encoding='utf-8')
          PY
          rm -f staging_normalize_batches_ready
          rm -f .github/workflows/normalize-batches-folder.yml
      - name: Commit folder normalization
        run: |
          git config user.name "dictionary-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use existing Batches folder for generated batches"
          git push
