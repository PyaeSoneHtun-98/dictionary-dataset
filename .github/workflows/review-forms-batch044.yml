name: Review Batch 044 Forms

on:
  push:
    paths:
      - 'staging/batch044/FORMS'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze manually reviewed forms
        run: |
          python - <<'PY'
          import base64, json, pathlib, zlib
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text())
          assert m['latestBatch']==43 and m['nextBatch']==44 and m['lookup']['uniqueLookupKeys']==35544
          prior=set(zlib.decompress(base64.b64decode((root/'lookup/used_keys_current.zlib.b64').read_text().strip())).decode().splitlines())
          assert len(prior)==35544
          sel=[x for x in (root/'staging/batch044/final_selection.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          headset={x.split('\t',1)[0].strip() for x in sel}; assert len(headset)==500
          dry=json.loads((root/'staging/batch044/ASSEMBLY_DRYRUN.json').read_text(encoding='utf-8'))
          assert dry['batch']==44 and dry['verbCount']==63 and dry['proposedFormCount']==190
          forms={k:list(v) for k,v in dry['verbForms'].items()}
          corrections={}

          # chide: lemminflect emitted nonstandard "chidded"; retain attested chid/chidden.
          assert 'chidded' in forms['chide']
          forms['chide']=[f for f in forms['chide'] if f!='chidded']
          corrections['chide']={'removed':['chidded'],'kept':forms['chide']}

          # outsell: correct irregular past/past participle is "outsold".
          assert 'outselled' in forms['outsell']
          forms['outsell']=[f for f in forms['outsell'] if f!='outselled']
          out_added=[]; out_skipped=[]
          if 'outsold' not in prior and 'outsold' not in headset:
              forms['outsell'].insert(1,'outsold'); out_added.append('outsold')
          else:
              out_skipped.append('outsold')
          corrections['outsell']={'removed':['outselled'],'added':out_added,'skippedCollision':out_skipped,'kept':[f for f in forms['outsell'] if f!='outsold']}

          # surveil: standard American forms double the l.
          bad=[f for f in ('surveiled','surveiling') if f in forms['surveil']]
          forms['surveil']=[f for f in forms['surveil'] if f not in ('surveiled','surveiling')]
          added=[]; skipped=[]
          for f in ('surveilled','surveilling'):
              if f not in prior and f not in headset and all(f not in vals for vals in forms.values()):
                  forms['surveil'].append(f); added.append(f)
              else:
                  skipped.append(f)
          corrections['surveil']={'removed':bad,'added':added,'skippedCollision':skipped,'kept':['surveils']}

          # lade also has the useful past participle "laden"; include only if collision-free.
          lade_added=[]; lade_skipped=[]
          if 'laden' not in prior and 'laden' not in headset and all('laden' not in vals for vals in forms.values()):
              forms['lade'].append('laden'); lade_added.append('laden')
          else:
              lade_skipped.append('laden')
          corrections['lade']={'added':lade_added,'skippedCollision':lade_skipped,'kept':forms['lade']}

          flat=[]
          for w,vals in forms.items():
              assert w in headset and len(vals)==len(set(vals))
              for f in vals:
                  assert f.isascii() and f.isalpha() and f==f.lower()
                  assert f!=w and f not in prior and f not in headset
                  flat.append(f)
          assert len(flat)==len(set(flat))
          report={
            'batch':44,
            'verbCount':len(forms),
            'reviewedFormCount':len(flat),
            'corrections':corrections,
            'verbForms':forms,
            'formsReviewed':True
          }
          (root/'staging/batch044/REVIEWED_FORMS.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'verbCount':len(forms),'reviewedFormCount':len(flat),'corrections':corrections},indent=2))
          PY
      - name: Commit reviewed forms
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch044/REVIEWED_FORMS.json
          git commit -m 'Review Batch 044 forms'
          git push
