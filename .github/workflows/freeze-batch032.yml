name: Freeze Batch 032 Selection

on:
  push:
    paths:
      - 'staging/batch032/FREEZE'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze reviewed 500
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          cdir=root/'staging'/'batch032'/'candidates'
          rows=[]
          for i in range(1,21):
              rows += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed={r.split('\t',1)[0]:r for r in rows}
          first=[]
          for i in range(1,11):
              first += [x for x in (cdir/f'candidates_{i:02d}.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          reject=set('eros eskimo lombard looney medici mojave nepali westside cajun calvary sars whig chou bolshevik duma mongol sapiens singaporean kashmiri madeira oreo pisces scrooge uruguayan valhalla balboa falco inuit muscat rwandan aegean franciscan'.split())
          replacements='immobile macabre magnification midwifery milieu myocardial nepotism oblong ophthalmology orca overseer pall patchy perceptual promiscuous resell scrapbook sensibly smartly somatic tantamount trifle twine unjustly viciously bogey boron brotherly concentric congregate cursory dearth'.split()
          assert len(reject)==32 and len(replacements)==32
          kept=[r for r in first if r.split('\t',1)[0] not in reject]
          assert len(kept)==468, len(kept)
          assert all(w in parsed for w in replacements)
          final=kept+[parsed[w] for w in replacements]
          words=[r.split('\t',1)[0] for r in final]
          assert len(final)==500 and len(set(words))==500
          assert not (set(words)&reject)
          out=root/'staging'/'batch032'/'final_selection.tsv'
          out.write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch032'/'SELECTION_SUMMARY.txt').write_text(f'kept={len(kept)}\nreplacements={len(replacements)}\nfinal={len(final)}\n',encoding='utf-8')
          PY
      - name: Commit selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch032/final_selection.tsv staging/batch032/SELECTION_SUMMARY.txt
          git commit -m 'Freeze Batch 032 selection'
          git push
