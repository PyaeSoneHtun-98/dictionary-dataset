name: Select Batch 029 Candidates
on:
  push:
    paths:
      - staging/batch029/SELECT
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lexical resources
        run: |
          python -m pip install --quiet nltk wordfreq cmudict
          python - <<'PY'
          import nltk
          nltk.download('wordnet', quiet=True)
          PY
      - name: Build candidate pool
        run: |
          python - <<'PY'
          import base64,json,pathlib,re,zlib
          from nltk.corpus import wordnet as wn
          from wordfreq import top_n_list, zipf_frequency
          import cmudict
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text())
          assert m['latestBatch']==28 and m['nextBatch']==29
          enc=(root/'lookup'/'used_keys_current.zlib.b64').read_text().strip()
          prior=set(zlib.decompress(base64.b64decode(enc)).decode().splitlines())
          assert len(prior)==m['lookup']['uniqueLookupKeys']==26432
          pron=cmudict.dict()
          allowed=[('noun',wn.NOUN),('verb',wn.VERB),('adjective',wn.ADJ),('adverb',wn.ADV)]
          bad_words=set('''aaa afl asap calif corp prof neuro reps specs tabs mens bots boomers fellas haters rappers raptors catholics africans arabs euros labs dicks veggies fuckers highschool webpage porno blowjob dildo hobbit lego chevy kraft pharma whisky sherry opium nicotine morphine'''.split())
          def bad_definition(d):
            dl=d.lower()
            pats=['trademark','native or inhabitant of','official language','language spoken','genus of','dynasty that ruled','street name for','federal department','united states liquid unit','position 11 in','position 12 in','position 13 in','position 14 in','position 16 in','position 18 in','offensive term for','slang) offensive term','invented by j.r.r.','member of a catholic church']
            return any(p in dl for p in pats)
          rows=[]; seen=set()
          for w in top_n_list('en', 90000):
            w=w.lower().strip()
            if len(rows)>=850: break
            if not re.fullmatch(r'[a-z]{4,16}',w): continue
            if w in seen or w in prior or w in bad_words: continue
            z=zipf_frequency(w,'en')
            if not (2.70 <= z <= 3.42): continue
            if w not in pron: continue
            # Reject obvious inflected forms whenever WordNet normalizes them to another base.
            inflected=False
            for p in (wn.NOUN,wn.VERB,wn.ADJ,wn.ADV):
              base=wn.morphy(w,p)
              if base and base!=w and len(base)>=3:
                inflected=True; break
            if inflected: continue
            chosen=None
            for label,p in allowed:
              syns=[s for s in wn.synsets(w,pos=p) if any(l.name().lower()==w for l in s.lemmas())]
              if not syns: continue
              # Prefer a non-instance, non-proper-looking, non-malformed sense.
              for s in syns:
                d=s.definition().strip()
                if s.instance_hypernyms(): continue
                if bad_definition(d): continue
                chosen=(label,d,pron[w][0]); break
              if chosen: break
            if not chosen: continue
            # Strong heuristic against names/entities that WordNet sometimes leaks.
            if w in {'erica','veronica','amelia','kylie','marcel','donna','melissa','jared','elvis','hans','silva','brent','toby','sonny','malik','jasper','madden','sawyer','derrick','underwood','clement','dirk','bourne','mina','finn','eden','rosa'}: continue
            label,d,phones=chosen
            seen.add(w); rows.append((w,label,f'{z:.2f}',' '.join(phones),d.replace('\t',' ').replace('\n',' ')))
          assert len(rows)>=700, len(rows)
          out=root/'staging'/'batch029'/'candidates'; out.mkdir(parents=True,exist_ok=True)
          for i in range(0,len(rows),50):
            part=rows[i:i+50]
            (out/f'candidates_{i//50+1:02d}.tsv').write_text('\n'.join('\t'.join(r) for r in part)+'\n',encoding='utf-8')
          (out/'SUMMARY.txt').write_text(f'candidates={len(rows)}\nprior_keys={len(prior)}\nzipf=2.70..3.42\n',encoding='utf-8')
          PY
      - name: Commit candidates
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch029/candidates
          git commit -m "Stage Batch 029 candidates"
          git push
