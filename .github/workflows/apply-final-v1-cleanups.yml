name: Apply final dictionary v1 cleanups

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-final-v1-cleanups.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset
        uses: actions/checkout@v4

      - name: Apply final deterministic cleanups
        run: |
          python scripts/apply_final_data_cleanups.py \
            --report final_data_cleanup_report.json

      - name: Rebuild cumulative lookup index
        run: python scripts/rebuild_lookup.py

      - name: Fetch current Subtitle Bridge legacy fallback
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/PyaeSoneHtun-98/stremio_dictionary/master/src/main/translation/legacyDictionary.ts \
            -o /tmp/legacyDictionary.ts

      - name: Run full v1 structural audit
        run: |
          python scripts/finalize_v1.py \
            --legacy-ts /tmp/legacyDictionary.ts \
            --report-json finalization_report.json \
            --report-md finalization_report.md \
            --candidate dictionary_v1_candidate.json

      - name: Check diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Batches lookup/used_keys_current.zlib.b64 dictionary_manifest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Clean final v1 dictionary data"
            git push origin HEAD:master
          fi

      - name: Upload cleanup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-v1-final-cleanup-audit
          if-no-files-found: warn
          path: |
            final_data_cleanup_report.json
            finalization_report.json
            finalization_report.md
            dictionary_v1_candidate.json
