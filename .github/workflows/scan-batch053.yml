name: Scan Dictionary Batch 053 Candidates
on:
  push:
    paths:
      - 'staging/batch053/SCAN'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate candidate scan
        run: |
          python - <<'PY'
          import base64, io, pathlib, re, urllib.request, zipfile, zlib
          root=pathlib.Path('.'); stage=root/'staging'/'batch053'; stage.mkdir(parents=True,exist_ok=True)
          used=set(zlib.decompress(base64.b64decode((root/'lookup'/'used_keys_current.zlib.b64').read_text().strip())).decode().splitlines())
          def raw(url):
              with urllib.request.urlopen(url,timeout=40) as r:return r.read()
          def text(url):return raw(url).decode('utf-8')
          wn='https://raw.githubusercontent.com/evllabs/JGAAP/master/src/com/jgaap/resources/wordnet/'
          lex=set()
          for f in ('index.noun','index.verb','index.adj','index.adv'):
              for line in text(wn+f).splitlines():
                  if line and not line.startswith(' '):
                      w=line.split()[0].lower()
                      if re.fullmatch(r'[a-z]{4,18}',w):lex.add(w)
          names=set()
          try:
              z=zipfile.ZipFile(io.BytesIO(raw('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/names.zip')))
              for fn in z.namelist():
                  if fn.endswith(('male.txt','female.txt')):
                      names.update(x.strip().lower() for x in z.read(fn).decode().splitlines() if x.strip().isalpha())
          except Exception:pass
          bad=set('''american english french german chinese british spanish russian japanese indian italian christian jewish greek catholic soviet irish korean mexican african nazi asian swedish arabic turkish canadian thai egyptian scottish australian vietnamese portuguese danish brazilian israeli hebrew hungarian islamic norwegian buddhist hindu czech iraqi iranian indonesian dutch cuban swiss muslim arab america england france germany china japan india italy russia mexico canada spain britain europe africa asia texas california chicago paris london rome washington hollywood israel tokyo berlin boston florida miami scotland korea moscow australia vietnam egypt iraq brazil georgia hawaii manhattan seattle houston dallas cuba venice milan switzerland poland vienna seoul ireland jerusalem greece delhi mumbai arizona oxford ohio shanghai sweden holland denver madrid thailand pakistan philadelphia alaska carolina colorado iran baltimore amsterdam mississippi portugal norway manchester prague indiana denmark santiago michigan portland singapore taiwan athens geneva argentina beijing babylon nevada austria dubai columbia richmond istanbul toronto kentucky warsaw barcelona bangkok oregon munich belgium stockholm connecticut orlando columbus pittsburgh tennessee cambridge salem dakota alabama louisiana brussels illinois montreal syria oklahoma maine osaka cairo memphis peru kyoto baghdad chile copenhagen'''.split())|names
          freq=text('https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt')
          out=[]
          for line in freq.splitlines():
              p=line.split()
              if not p:continue
              w=p[0].lower()
              if w in used or w in bad or w not in lex or not re.fullmatch(r'[a-z]{4,18}',w):continue
              if w.endswith(('ing','ed','ies')):continue
              if w.endswith('s') and w[:-1] in lex:continue
              if w not in out:out.append(w)
              if len(out)>=1500:break
          (stage/'scan.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          (stage/'SCAN').unlink(missing_ok=True)
          wf=root/'.github'/'workflows'/'scan-batch053.yml'
          if wf.exists():wf.unlink()
          print('scan',len(out))
          PY
      - name: Commit scan
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Generate Batch 053 candidate scan"
          git push
