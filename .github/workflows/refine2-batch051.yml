name: Final Refine Dictionary Batch 051

on:
  push:
    paths:
      - 'staging/batch051/REFINE2'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select canonical non-proper unused words
        run: |
          python - <<'PY'
          import base64, pathlib, re, urllib.request, zlib

          root=pathlib.Path('.')
          stage=root/'staging'/'batch051'
          encoded=(root/'lookup'/'used_keys_current.zlib.b64').read_text(encoding='ascii').strip()
          used=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())

          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return r.read().decode('utf-8')

          base='https://raw.githubusercontent.com/evllabs/JGAAP/master/src/com/jgaap/resources/wordnet/'
          source={}
          alllex=set()
          for pos,file in [('noun','index.noun'),('verb','index.verb'),('adjective','index.adj'),('adverb','index.adv')]:
              s=set()
              for line in get(base+file).splitlines():
                  if not line or line.startswith(' '): continue
                  w=line.split()[0].lower()
                  if re.fullmatch(r'[a-z]{3,18}',w):
                      s.add(w); alllex.add(w)
              source[pos]=s

          freq={}
          for i,line in enumerate(get('https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt').splitlines(),1):
              p=line.split()
              if p and p[0] not in freq: freq[p[0]]=i

          names=set()
          try:
              for x in get('https://raw.githubusercontent.com/dominictarr/random-name/master/first-names.txt').splitlines():
                  x=x.strip().lower()
                  if x.isalpha(): names.add(x)
          except Exception:
              pass

          banned=set('''the and yes no hello okay yeah please who why here there then now one two three four five six seven eight nine ten
          can will may must are isn ain won mrs ago ooh aah wow gotta till
          christ christmas jesus america europe africa england france germany china japan india rome paris london washington
          sunday monday tuesday wednesday thursday friday saturday january february march april june july august september october november december
          hollywood american english french german chinese british spanish russian japanese indian italian christian jewish greek catholic soviet irish korean mexican african nazi asian swedish arabic turkish canadian thai egyptian scottish australian vietnamese portuguese danish brazilian israeli hebrew hungarian islamic norwegian buddhist hindu czech iraqi iranian indonesian
          latin dutch european swiss cuban hawaiian persian armenian filipino venetian siamese argentine dominican mongol sikh athenian sumerian genovese sudanese babylonian argentinian manchurian californian olympian polynesian tuscan corsican milanese elizabethan macedonian slav appalachian dalmatian carthaginian phoenician yugoslavian columbian andean minoan homeric jungian rumanian hegelian
          thing things years days times words works lots someone whatever nothing being going coming talking getting taking looking saying working playing living waiting telling running giving speaking using happening sitting crying wearing killing standing dying walking starting eating driving holding beginning drinking listening helping keeping acting
          fuckin ass mum mommy mister santa
          '''.split())
          banned |= names

          reject=set('''cetera bianco coste corne cul dea diff doble doo ell entre epsom fait ken mano par russe stein centum centrex darlin derring gentlelady goverment jakes klieg knott kraut krona kroner lima linage lobo lookit lulu majeure markkaa mealynose millon
          saw felt made said gone heard used taken tried born written built held sold ate sat led grown forgotten kept paid finished stopped liked turned loved
          '''.split())

          def canonical(w):
              if w in banned or w in reject: return False
              if w.endswith('ies') and len(w)>4 and w[:-3]+'y' in alllex: return False
              if w.endswith('es') and len(w)>4 and w[:-2] in alllex: return False
              if w.endswith('s') and len(w)>3 and w[:-1] in alllex: return False
              if w.endswith('ing') and len(w)>5:
                  stem=w[:-3]
                  if stem in alllex or stem+'e' in alllex or (len(stem)>2 and stem[-1]==stem[-2] and stem[:-1] in alllex): return False
              if w.endswith('ed') and len(w)>4:
                  stem=w[:-2]
                  if stem in alllex or stem+'e' in alllex or (len(stem)>2 and stem[-1]==stem[-2] and stem[:-1] in alllex): return False
              if w.endswith('er') and len(w)>4 and w[:-2] in source['adjective']: return False
              if w.endswith('est') and len(w)>5 and w[:-3] in source['adjective']: return False
              return True

          # POS choice: noun first for people/things, verb first only if not a noun.
          lex={}
          for w in alllex:
              if w in source['verb'] and w not in source['noun']: pos='verb'
              elif w in source['noun']: pos='noun'
              elif w in source['verb']: pos='verb'
              elif w in source['adjective']: pos='adjective'
              else: pos='adverb'
              lex[w]=pos

          rows=[]
          for w,pos in lex.items():
              if w in used or not canonical(w): continue
              r=freq.get(w,999999)
              score=(r if r<999999 else 190000)+len(w)*35
              if pos=='verb': score-=220
              elif pos=='noun': score-=120
              if re.match(r'^(non|anti|counter|inter|intra|multi|pre|post|sub|super|hyper|hypo)',w):
                  score+=1800
              rows.append((score,w,pos))
          rows.sort(key=lambda x:(x[0],x[1]))

          selected=[(w,pos) for _,w,pos in rows[:500]]
          assert len(selected)==500 and len({w for w,_ in selected})==500
          assert not ({w for w,_ in selected}&used)
          assert all(canonical(w) for w,_ in selected)

          (stage/'selection.tsv').write_text(''.join(f'{w}\t{p}\n' for w,p in selected),encoding='utf-8')
          (stage/'REFINE2').unlink(missing_ok=True)
          wf=root/'.github'/'workflows'/'refine2-batch051.yml'
          if wf.exists(): wf.unlink()
          print('selected',len(selected))
          PY

      - name: Commit final selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Finalize Batch 051 canonical selection"
          git push
