name: Finalize Dictionary Batch 048

on:
  push:
    paths:
      - 'staging/batch048/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pronunciation engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng

      - name: Assemble, validate, and finalize Batch 048
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, shutil, subprocess, zlib

          root = pathlib.Path('.')
          manifest_path = root / 'dictionary_manifest.json'
          lookup_path = root / 'lookup' / 'used_keys_current.zlib.b64'
          stage = root / 'staging' / 'batch048'
          out = root / 'Batches' / 'dictionary_batch_048.json'

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['latestBatch'] == 47
          assert manifest['nextBatch'] == 48
          assert manifest['batchCount'] == 47
          assert manifest['totalHeadwords'] == 23500
          assert manifest['lookup']['throughBatch'] == 47
          assert manifest['lookup']['uniqueLookupKeys'] == 37891
          assert manifest['lookup']['uniqueHeadwords'] == 23500
          assert manifest['lookup']['uniqueStoredForms'] == 14437

          encoded = lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == manifest['lookup']['sha256']
          prior = set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())
          assert len(prior) == 37891

          rows = []
          parts = sorted(stage.glob('part*.tsv'))
          assert [p.name for p in parts] == [f'part{i:02d}.tsv' for i in range(1, 6)]
          for part in parts:
              lines = [x for x in part.read_text(encoding='utf-8').splitlines() if x.strip()]
              assert len(lines) == 100, (part, len(lines))
              for raw in lines:
                  fields = raw.split('\t')
                  assert len(fields) == 3, (part, raw)
                  word, pos, gloss = (x.strip() for x in fields)
                  rows.append((word, pos, gloss))

          assert len(rows) == 500
          words = [r[0] for r in rows]
          wordset = set(words)
          assert len(wordset) == 500
          assert not (wordset & prior), sorted(wordset & prior)[:20]
          assert not out.exists()

          allowed = {'adjective', 'adverb'}
          latin = re.compile(r'[A-Za-z]')
          entries = []
          for word, pos, gloss in rows:
              assert word.isascii() and word.isalpha() and word == word.lower(), word
              assert pos in allowed, (word, pos)
              assert gloss and not latin.search(gloss), (word, gloss)
              ipa = subprocess.run(
                  ['espeak-ng', '-q', '--ipa=3', '-v', 'en-us', word],
                  check=True, capture_output=True, text=True
              ).stdout.strip()
              ipa = re.sub(r'\s+', '', ipa).replace('/', '')
              assert ipa, word
              entries.append({
                  'word': word,
                  'pronunciation': f'/{ipa}/',
                  'forms': [],
                  'meanings': [{'partOfSpeech': pos, 'burmese': [gloss]}],
              })

          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              json.dumps({'version': 1, 'batch': 48, 'entries': entries}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          newkeys = prior | wordset
          assert len(newkeys) == 38391
          payload = '\n'.join(sorted(newkeys)).encode('utf-8')
          new_encoded = base64.b64encode(zlib.compress(payload, 9)).decode('ascii')
          lookup_path.write_text(new_encoded + '\n', encoding='ascii')

          manifest['latestBatch'] = 48
          manifest['nextBatch'] = 49
          manifest['batchCount'] = 48
          manifest['totalHeadwords'] = 24000
          manifest['lookup']['throughBatch'] = 48
          manifest['lookup']['uniqueLookupKeys'] = len(newkeys)
          manifest['lookup']['uniqueHeadwords'] = 24000
          manifest['lookup']['uniqueStoredForms'] = 14437
          manifest['lookup']['sha256'] = hashlib.sha256(new_encoded.encode('ascii')).hexdigest()
          assert manifest['totalHeadwords'] == manifest['batchCount'] * 500
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          old = 'Batches 001–047 have been generated: **23,500 unique headwords**.'
          new = 'Batches 001–048 have been generated: **24,000 unique headwords**.'
          assert old in text
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          shutil.rmtree(stage)
          workflow = root / '.github' / 'workflows' / 'finalize-batch048.yml'
          if workflow.exists():
              workflow.unlink()

          print('VALID')
          print('entries:', len(entries))
          print('prior_lookup_keys:', len(prior))
          print('new_lookup_keys:', len(newkeys))
          print('total_headwords:', manifest['totalHeadwords'])
          PY

      - name: Commit Batch 048
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Add dictionary Batch 048"
          git push
