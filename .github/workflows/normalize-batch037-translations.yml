name: Normalize Batch 037 Translations

on:
  push:
    paths:
      - 'staging/batch037/NORMALIZE'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize exact TSV rows
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')/'staging'/'batch037'/'translations'
          total=0
          files=sorted(root.glob('part*.tsv'))
          assert len(files)==5
          for p in files:
              rows=[]
              for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  if not line.strip(): continue
                  parts=line.split('\t')
                  assert len(parts)==3,(p.name,i,line)
                  w,pos,g=(x.strip() for x in parts)
                  assert w and pos and g
                  rows.append(f'{w}\t{pos}\t{g}')
              assert len(rows)==100,(p.name,len(rows))
              p.write_text('\n'.join(rows)+'\n',encoding='utf-8')
              total+=len(rows)
          assert total==500,total
          PY
      - name: Commit normalization
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch037/translations
          git diff --cached --quiet || git commit -m 'Normalize Batch 037 translations'
          git push
