name: Build Batch 067 Candidates

on:
  push:
    branches: [master]
    paths:
      - 'staging/batch067/BUILD_CANDIDATES'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lexical resources
        run: |
          python -m pip install --quiet wordfreq nltk cmudict
          python - <<'PY'
          import nltk
          nltk.download('wordnet', quiet=True)
          PY
      - name: Build fresh hybrid lexical pool
        run: |
          python - <<'PY'
          import base64, json, pathlib, re, zlib
          from wordfreq import top_n_list, zipf_frequency
          from nltk.corpus import wordnet as wn
          import cmudict

          root=pathlib.Path('.')
          manifest=json.loads((root/'dictionary_extension_manifest.json').read_text(encoding='utf-8'))
          assert manifest['latestBatch']==66 and manifest['nextBatch']==67, manifest

          encoded=(root/'extension_lookup'/'used_keys_current.zlib.b64').read_text(encoding='ascii').strip()
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())
          assert len(prior)==50522, len(prior)

          cmu=cmudict.dict()
          posmap={wn.NOUN:'noun',wn.VERB:'verb',wn.ADJ:'adjective',wn.ADV:'adverb'}
          basic=set('the and is are was were be been being a an to of in on at for from with without by as or but if then than this that these those i you he she it we they me him her us them my your his its our their mine yours ours theirs yes no hello good bad okay ok maybe very really just only also now there here have has had do does did get got make made know think want need like love time year day people person thing things one two three four five first last most much many more less little big small new old right wrong well too before after why who what when where how can could would should will shall may might must'.split())
          reject_words=set('html http https jpeg jpg gif php dvd dvds mp3 ipod xbox linux unix wikipedia google facebook instagram tiktok twitter reddit'.split())
          banned_defs=[
            'native or inhabitant','official language','language spoken','dynasty that ruled','federal department',
            'federation of','title for the former','basic unit of money','monetary unit','a native of',
            'ethnic slur','offensive term for a person of','street name for','trademarked method'
          ]

          freq_words=[w.lower().strip() for w in top_n_list('en',1200000)]
          wn_words={w.lower() for w in wn.all_lemma_names()
                    if '_' not in w and '-' not in w and w.isascii() and w.isalpha()}
          ordered=[]
          seen=set()
          for w in freq_words:
              if w not in seen:
                  ordered.append(w); seen.add(w)
          # Add WordNet-only lemmas after frequency-ranked words, then sort final
          # accepted rows by Zipf frequency and POS usefulness.
          for w in sorted(wn_words):
              if w not in seen:
                  ordered.append(w); seen.add(w)

          rows=[]
          for w in ordered:
              if w in prior or w in basic or w in reject_words: continue
              if not (w.isascii() and w.isalpha() and w==w.lower()): continue
              if len(w)<4 or len(w)>18 or w not in cmu: continue
              syns=[s for s in wn.synsets(w) if s.pos() in posmap and any(l.name().lower()==w for l in s.lemmas())]
              if not syns: continue
              if any(s.instance_hypernyms() for s in syns): continue
              if any(any(l.name()[:1].isupper() for l in s.lemmas()) for s in syns): continue
              defs=' || '.join(s.definition().lower() for s in syns[:5])
              if any(x in defs for x in banned_defs): continue
              s=syns[0]
              f=zipf_frequency(w,'en')
              score=f*10 + {wn.VERB:18,wn.ADJ:13,wn.ADV:10,wn.NOUN:4}[s.pos()]
              d=s.definition().lower()
              for k in ['person','someone','worker','doctor','patient','crime','law','court','police','money','emotion','feeling','house','home','vehicle','tool','device','equipment','film','stage','speech','argument','food','clothing','work','business','computer','signal','injury','body','school','travel','road','book','writing','language','camera','room']:
                  if k in d: score += 1.2
              rows.append({
                  'word':w,
                  'partOfSpeech':posmap[s.pos()],
                  'zipf':round(f,2),
                  'score':round(score,2),
                  'definition':s.definition(),
                  'cmu':cmu[w][0]
              })

          rows.sort(key=lambda x:(-x['score'],-x['zipf'],x['word']))
          rows=rows[:2600]
          assert len(rows)>=1100, len(rows)

          out=root/'staging'/'batch067'/'candidates'
          out.mkdir(parents=True,exist_ok=True)
          for p in out.glob('*'): p.unlink()
          for i in range(0,len(rows),100):
              (out/f'candidates_{i//100+1:02d}.json').write_text(
                  json.dumps(rows[i:i+100],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          counts={}
          for x in rows: counts[x['partOfSpeech']]=counts.get(x['partOfSpeech'],0)+1
          (out/'SUMMARY.json').write_text(json.dumps({
              'count':len(rows),'priorKeys':len(prior),'counts':counts,
              'first':rows[0]['word'],'last':rows[-1]['word'],
              'zipfMin':min(x['zipf'] for x in rows),'zipfMax':max(x['zipf'] for x in rows)
          },indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'count':len(rows),'counts':counts,'first20':[x['word'] for x in rows[:20]]},indent=2))
          PY
      - name: Commit candidates
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch067/candidates
          git commit -m 'Build fresh Batch 067 hybrid candidate pool'
          git push
