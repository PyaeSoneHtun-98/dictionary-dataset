name: Finalize Dictionary Batch 027

on:
  push:
    paths:
      - 'staging/batch027/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install helpers
        run: python -m pip install --quiet lemminflect eng-to-ipa
      - name: Assemble and validate Batch 027
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, shutil, zlib
          from lemminflect import getInflection
          import eng_to_ipa as e2i

          root=pathlib.Path('.')
          manifest_path=root/'dictionary_manifest.json'
          lookup_path=root/'lookup'/'used_keys_current.zlib.b64'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['latestBatch']==26 and manifest['nextBatch']==27
          assert manifest['batchCount']==26 and manifest['totalHeadwords']==13000
          assert manifest['lookup']['throughBatch']==26

          encoded=lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest()==manifest['lookup']['sha256']
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())
          assert len(prior)==manifest['lookup']['uniqueLookupKeys']==25275

          rows=[]
          for i in range(1,11):
              p=root/'staging'/'batch027'/'candidates_v3'/f'candidates_{i:02d}.tsv'
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if raw.strip():
                      w,pos,freq,definition=raw.split('\t',3)
                      rows.append((w.strip(),definition.strip()))
          assert len(rows)==500
          denied={'smaller','greatest','bigger','arts','humans','communications','teeth','tons','woods','lowest','fewer','corp','transactions','graphics','proceedings','teens','earliest','neuro','prof','classics','calif','healthier','deeds','flats','heavens','jeep','haired'}
          replacements=['chalk','councillor','entirety','flock','footballer','hemisphere','lastly','neighbour','persona','realism','scrub','shale','sophomore','tinder','countdown','investigative','obese','perimeter','sushi','turnout','commercially','gladly','honourable','irresponsible','rant','apologise','crunch']
          reserve=[r.split('\t',1)[0].strip() for r in (root/'staging'/'batch027'/'candidates_v3'/'candidates_11.tsv').read_text(encoding='utf-8').splitlines() if r.strip()]
          assert all(w in reserve for w in replacements)
          words=[w for w,d in rows if w not in denied and 'basic monetary unit of most members of the European Union' not in d]+replacements
          headset=set(words)
          assert len(words)==500 and len(headset)==500
          assert not (headset&prior)
          assert all(w.isascii() and w.isalpha() and w==w.lower() and '-' not in w for w in words)

          translations={}
          for p in sorted((root/'staging'/'batch027'/'translations').glob('*.tsv')):
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  w,pos,blob=raw.split('\t',2); w=w.strip(); pos=pos.strip()
                  glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  assert w not in translations, w
                  translations[w]=(pos,glosses)
          assert len(translations)==500 and set(translations)==headset
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}
          latin=re.compile(r'[A-Za-z]')
          for w,(pos,glosses) in translations.items():
              assert pos in allowed and 1<=len(glosses)<=3
              assert all(g and not latin.search(g) for g in glosses), (w,glosses)

          used_forms=set(); entries=[]
          for w in words:
              pos,glosses=translations[w]
              ipa=e2i.convert(w,stress_marks='both').strip().replace('/','')
              assert ipa and '*' not in ipa and ipa.lower()!=w.lower() and '\n' not in ipa, (w,ipa)
              forms=[]
              if pos=='verb':
                  for tag in ('VBZ','VBD','VBN','VBG'):
                      for f in getInflection(w,tag=tag) or ():
                          f=f.lower().strip()
                          if not f or f==w or not f.isascii() or not f.isalpha(): continue
                          if f in prior or f in headset or f in used_forms or f in forms: continue
                          forms.append(f); used_forms.add(f)
              entries.append({'word':w,'pronunciation':f'/{ipa}/','forms':forms,'meanings':[{'partOfSpeech':pos,'burmese':glosses}]})

          assert len(entries)==500 and len({e['word'] for e in entries})==500
          new_forms=[f for e in entries for f in e['forms']]
          assert len(new_forms)==len(set(new_forms))
          assert not (set(new_forms)&prior) and not (set(new_forms)&headset)
          for e in entries:
              assert e['word'] not in e['forms'] and len(e['forms'])==len(set(e['forms']))
              assert e['pronunciation'].startswith('/') and e['pronunciation'].endswith('/') and len(e['pronunciation'])>2
              assert sum(len(m['burmese']) for m in e['meanings'])<=3

          out=root/'Batches'/'dictionary_batch_027.json'
          assert not out.exists(), 'Batch 027 already exists'
          out.write_text(json.dumps({'version':1,'batch':27,'entries':entries},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          all_keys=prior|headset|set(new_forms)
          lookup_plain=('\n'.join(sorted(all_keys))+'\n').encode('utf-8')
          lookup_encoded=base64.b64encode(zlib.compress(lookup_plain,9)).decode('ascii')
          lookup_path.write_text(lookup_encoded,encoding='ascii')

          manifest['latestBatch']=27; manifest['nextBatch']=28; manifest['batchCount']=27; manifest['totalHeadwords']=13500
          manifest['lookup']['throughBatch']=27
          manifest['lookup']['uniqueLookupKeys']=len(all_keys)
          manifest['lookup']['uniqueHeadwords']=13500
          manifest['lookup']['uniqueStoredForms']=manifest['lookup']['uniqueStoredForms']+len(new_forms)
          manifest['lookup']['sha256']=hashlib.sha256(lookup_encoded.encode('ascii')).hexdigest()
          manifest['batchFilenamePattern']='Batches/dictionary_batch_XXX.json'
          assert manifest['totalHeadwords']==manifest['batchCount']*500
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme_path=root/'README.md'
          readme=readme_path.read_text(encoding='utf-8').replace('Batches 001–026 have been generated: **13,000 unique headwords**.','Batches 001–027 have been generated: **13,500 unique headwords**.')
          readme_path.write_text(readme,encoding='utf-8')

          report={'batch':27,'entries':500,'newForms':len(new_forms),'priorLookupKeys':len(prior),'uniqueLookupKeys':len(all_keys),'totalHeadwords':13500,'nextBatch':28,'lookupSha256':manifest['lookup']['sha256']}
          (root/'batch027_validation.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')

          shutil.rmtree(root/'staging'/'batch027',ignore_errors=True)
          for name in ['select-batch027.yml','select-batch027-v2.yml','select-batch027-v3.yml','validate-batch027-staged.yml','validate-batch027-staged-v2.yml','diagnose-batch027-count.yml','finalize-batch027.yml']:
              (root/'.github'/'workflows'/name).unlink(missing_ok=True)
          print(json.dumps(report,indent=2))
          PY
      - name: Commit Batch 027 atomically
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Add dictionary Batch 027'
          git push
