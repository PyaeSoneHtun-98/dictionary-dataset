name: Sync Phrase Dataset

on:
  push:
    paths:
      - "PhraseBatches/**"
      - ".github/workflows/sync-phrase-dataset.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run phrase tests
        run: python -m unittest tests/test_phrase_dictionary.py

      - name: Validate all phrase batches
        shell: bash
        run: |
          shopt -s nullglob
          for batch in PhraseBatches/phrase_batch_*.json; do
            python scripts/validate_phrase_batch.py "$batch" --no-manifest-check
          done

      - name: Rebuild phrase lookup and manifest
        run: python scripts/rebuild_phrase_lookup.py --write

      - name: Commit deterministic phrase state
        shell: bash
        run: |
          if git diff --quiet -- phrase_manifest.json phrase_lookup/used_phrase_keys_current.zlib.b64; then
            echo "Phrase state already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phrase_manifest.json phrase_lookup/used_phrase_keys_current.zlib.b64
          git commit -m "Sync phrase dataset state"
          git push
