name: Refine Batch 042 Selection

on:
  push:
    paths:
      - 'staging/batch042/REFINE'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply second canonicality sweep
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          sel=root/'staging'/'batch042'/'final_selection.tsv'
          rows=[x for x in sel.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==500 and len({x.split('\t',1)[0] for x in rows})==500
          reject={'pompadour','quixotic','biro','herm'}
          assert reject <= {x.split('\t',1)[0] for x in rows}
          cdir=root/'staging'/'batch042'/'candidates'
          reserve={}
          for p in sorted(cdir.glob('candidates_*.tsv')):
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip(): reserve[line.split('\t',1)[0]]=line
          replacements=['oligopoly','opine','portent','scrounge']
          assert all(w in reserve for w in replacements)
          current={x.split('\t',1)[0] for x in rows}
          assert not (set(replacements)&current)
          kept=[x for x in rows if x.split('\t',1)[0] not in reject]
          final=kept+[reserve[w] for w in replacements]
          assert len(final)==500 and len({x.split('\t',1)[0] for x in final})==500
          sel.write_text('\n'.join(final)+'\n',encoding='utf-8')
          (root/'staging'/'batch042'/'SELECTION_SUMMARY.txt').write_text('retained=454\nreplacements=46\nfinal=500\nsecondSweepReplacements=4\n',encoding='utf-8')
          print('refined',sorted(reject),'->',replacements)
          PY
      - name: Commit refined selection
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch042/final_selection.tsv staging/batch042/SELECTION_SUMMARY.txt
          git commit -m 'Refine Batch 042 selection'
          git push
