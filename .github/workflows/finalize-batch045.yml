name: Finalize Dictionary Batch 045

on:
  push:
    paths:
      - 'staging/batch045/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pronunciation helper
        run: python -m pip install --quiet eng-to-ipa
      - name: Assemble and validate Batch 045
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, shutil, zlib
          import eng_to_ipa as e2i

          root=pathlib.Path('.')
          manifest_path=root/'dictionary_manifest.json'
          lookup_path=root/'lookup'/'used_keys_current.zlib.b64'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))

          assert manifest['latestBatch']==44
          assert manifest['nextBatch']==45
          assert manifest['batchCount']==44
          assert manifest['totalHeadwords']==22000
          assert manifest['lookup']['throughBatch']==44
          assert manifest['lookup']['uniqueLookupKeys']==36233
          assert manifest['lookup']['uniqueHeadwords']==22000
          assert manifest['lookup']['uniqueStoredForms']==14279

          encoded=lookup_path.read_text(encoding='ascii').strip()
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest()==manifest['lookup']['sha256']=='7b5319ffe8ccd028219c4607a8bc02e3767abfac1b138198ff4969be2bfffb6e'
          prior=set(zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines())
          assert len(prior)==36233

          rows=[]
          for raw in (root/'staging/batch045/final_selection.tsv').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  w,pos,freq,phones,definition=raw.split('\t',4)
                  rows.append({
                      'word':w.strip(),
                      'sourcePos':pos.strip(),
                      'phones':phones.strip(),
                      'definition':definition.strip()
                  })
          words=[r['word'] for r in rows]
          headset=set(words)
          source_by={r['word']:r for r in rows}
          assert len(rows)==500 and len(headset)==500 and not (headset&prior)
          assert all(w.isascii() and w.isalpha() and w==w.lower() for w in words)

          translations={}
          for p in sorted((root/'staging/batch045/translations').glob('part*.tsv')):
              for raw in p.read_text(encoding='utf-8').splitlines():
                  if not raw.strip(): continue
                  w,pos,blob=(x.strip() for x in raw.split('\t',2))
                  glosses=[x.strip() for x in blob.split('|') if x.strip()]
                  assert w not in translations,w
                  translations[w]=(pos,glosses)
          assert len(translations)==500 and set(translations)==headset
          allowed={'noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','determiner','modal','auxiliary'}
          latin=re.compile(r'[A-Za-z]')
          for w,(pos,g) in translations.items():
              assert pos in allowed and 1<=len(g)<=3 and all(x and not latin.search(x) for x in g),(w,pos,g)

          staged=json.loads((root/'staging/batch045/TRANSLATION_VALIDATION.json').read_text(encoding='utf-8'))
          assert staged['batch']==45
          assert staged['finalWords']==500 and staged['uniqueWords']==500 and staged['translations']==500
          assert staged['partCounts']=={'part01.tsv':100,'part02.tsv':100,'part03.tsv':100,'part04.tsv':100,'part05.tsv':100}
          assert staged['priorLookupKeys']==36233
          assert staged['selectionReview']=={'retained':458,'replacements':42,'secondSweepReplacements':4}
          assert not staged['priorCollisions']
          assert not staged['malformed']
          assert not staged['duplicates']
          assert not staged['missing']
          assert not staged['extra']
          assert not staged['badGlossOrPos']

          reviewed=json.loads((root/'staging/batch045/REVIEWED_FORMS.json').read_text(encoding='utf-8'))
          expected_corrections={
            'counterstrike':{
              'removed':['counterstriked'],
              'added':['counterstruck'],
              'skippedCollision':[],
              'kept':['counterstrikes','counterstriking']
            }
          }
          assert reviewed['batch']==45
          assert reviewed['verbCount']==53
          assert reviewed['reviewedFormCount']==158
          assert reviewed['formsReviewed'] is True
          assert reviewed['corrections']==expected_corrections
          reviewed_forms=reviewed['verbForms']
          verb_words={w for w,(pos,_) in translations.items() if pos=='verb'}
          assert verb_words==set(reviewed_forms),(sorted(verb_words),sorted(reviewed_forms))
          assert reviewed_forms['counterstrike']==['counterstrikes','counterstruck','counterstriking']
          assert reviewed_forms['backslide']==['backslides','backslid','backslidden','backsliding']
          all_forms=[f for w in words for f in reviewed_forms.get(w,[])]
          assert len(all_forms)==158
          assert len(set(all_forms))==158
          assert not (set(all_forms)&prior)
          assert not (set(all_forms)&headset)

          dry=json.loads((root/'staging/batch045/ASSEMBLY_DRYRUN.json').read_text(encoding='utf-8'))
          expected_fallback=['daikon','palimpsest','gerund','counterstrike','unbox','blabber','manumission','barbel','americium','quahog','intrepidity','piton']
          assert dry['entries']==500
          assert dry['priorLookupKeys']==36233
          assert dry['verbCount']==53
          assert dry['proposedFormCount']==158
          assert dry['ipaFallbackWords']==expected_fallback
          assert dry['ipaFallbackCount']==12

          def fallback_ipa(phones):
              cmap={'B':'b','CH':'tʃ','D':'d','DH':'ð','F':'f','G':'ɡ','HH':'h','JH':'dʒ','K':'k','L':'l','M':'m','N':'n','NG':'ŋ','P':'p','R':'r','S':'s','SH':'ʃ','T':'t','TH':'θ','V':'v','W':'w','Y':'j','Z':'z','ZH':'ʒ'}
              vmap={'AA':'ɑ','AE':'æ','AO':'ɔ','AW':'aʊ','AY':'aɪ','EH':'ɛ','EY':'eɪ','IH':'ɪ','IY':'i','OW':'oʊ','OY':'ɔɪ','UH':'ʊ','UW':'u'}
              vowels=set(vmap)|{'AH','ER'}
              out=[]
              for tok in phones.split():
                  mm=re.match(r'^([A-Z]+)([012])?$',tok)
                  assert mm,(phones,tok)
                  base,stress=mm.group(1),mm.group(2)
                  if base=='AH':
                      sym='ə' if stress=='0' else 'ʌ'
                  elif base=='ER':
                      sym='ɚ' if stress=='0' else 'ɝ'
                  elif base in vmap:
                      sym=vmap[base]
                  else:
                      sym=cmap[base]
                  if stress=='1' and base in vowels:
                      sym='ˈ'+sym
                  elif stress=='2' and base in vowels:
                      sym='ˌ'+sym
                  out.append(sym)
              return ''.join(out)

          entries=[]
          fallback_words=[]
          for word in words:
              pos,glosses=translations[word]
              ipa=e2i.convert(word,stress_marks='both').strip()
              if not ipa or '*' in ipa or ipa.lower()==word.lower():
                  ipa=fallback_ipa(source_by[word]['phones'])
                  fallback_words.append(word)
              ipa=ipa.replace('/','').strip()
              assert ipa and '*' not in ipa and '\n' not in ipa
              entries.append({
                  'word':word,
                  'pronunciation':f'/{ipa}/',
                  'forms':list(reviewed_forms.get(word,[])),
                  'meanings':[{'partOfSpeech':pos,'burmese':glosses}]
              })
          assert len(entries)==500
          assert len({e['word'] for e in entries})==500
          assert fallback_words==expected_fallback

          out=root/'Batches'/'dictionary_batch_045.json'
          assert not out.exists(),'Batch 045 already exists'
          out.write_text(json.dumps({'version':1,'batch':45,'entries':entries},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          all_keys=prior|headset|set(all_forms)
          assert len(all_keys)==36233+500+158==36891
          plain=('\n'.join(sorted(all_keys))+'\n').encode('utf-8')
          lookup_encoded=base64.b64encode(zlib.compress(plain,9)).decode('ascii')
          lookup_path.write_text(lookup_encoded,encoding='ascii')

          manifest['latestBatch']=45
          manifest['nextBatch']=46
          manifest['batchCount']=45
          manifest['totalHeadwords']=22500
          manifest['lookup']['throughBatch']=45
          manifest['lookup']['uniqueLookupKeys']=36891
          manifest['lookup']['uniqueHeadwords']=22500
          manifest['lookup']['uniqueStoredForms']=14437
          manifest['lookup']['sha256']=hashlib.sha256(lookup_encoded.encode('ascii')).hexdigest()
          assert manifest['totalHeadwords']==manifest['batchCount']*500
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          rp=root/'README.md'
          text=rp.read_text(encoding='utf-8')
          old='Batches 001–044 have been generated: **22,000 unique headwords**.'
          new='Batches 001–045 have been generated: **22,500 unique headwords**.'
          assert old in text
          rp.write_text(text.replace(old,new),encoding='utf-8')

          report={
              'batch':45,
              'entries':500,
              'newForms':158,
              'priorLookupKeys':36233,
              'uniqueLookupKeys':36891,
              'totalHeadwords':22500,
              'nextBatch':46,
              'ipaFallbackCount':12,
              'ipaFallbackWords':fallback_words,
              'lookupSha256':manifest['lookup']['sha256'],
              'formsReviewed':True,
              'selectionReview':{'retained':458,'replacements':42,'secondSweepReplacements':4},
              'formCorrections':expected_corrections
          }
          (root/'batch045_validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          shutil.rmtree(root/'staging'/'batch045')
          for name in [
              'select-batch045.yml',
              'freeze-batch045.yml',
              'second-sweep-batch045.yml',
              'normalize-batch045-translations.yml',
              'validate-batch045.yml',
              'dryrun-batch045.yml',
              'review-forms-batch045.yml',
              'finalize-batch045.yml'
          ]:
              p=root/'.github'/'workflows'/name
              if p.exists():
                  p.unlink()

          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit Batch 045 atomically
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Add dictionary Batch 045'
          git push
