name: Review Batch 045 Forms

on:
  push:
    paths:
      - 'staging/batch045/FORMS'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze manually reviewed forms
        run: |
          python - <<'PY'
          import base64, json, pathlib, zlib
          root=pathlib.Path('.')
          m=json.loads((root/'dictionary_manifest.json').read_text())
          assert m['latestBatch']==44 and m['nextBatch']==45 and m['lookup']['uniqueLookupKeys']==36233
          prior=set(zlib.decompress(base64.b64decode((root/'lookup/used_keys_current.zlib.b64').read_text().strip())).decode().splitlines())
          assert len(prior)==36233
          sel=[x for x in (root/'staging/batch045/final_selection.tsv').read_text(encoding='utf-8').splitlines() if x.strip()]
          headset={x.split('\t',1)[0].strip() for x in sel}; assert len(headset)==500
          dry=json.loads((root/'staging/batch045/ASSEMBLY_DRYRUN.json').read_text(encoding='utf-8'))
          assert dry['batch']==45 and dry['verbCount']==53 and dry['proposedFormCount']==158
          forms={k:list(v) for k,v in dry['verbForms'].items()}
          corrections={}

          assert forms['counterstrike']==['counterstrikes','counterstriked','counterstriking']
          forms['counterstrike']=[f for f in forms['counterstrike'] if f!='counterstriked']
          added=[]; skipped=[]
          if 'counterstruck' not in prior and 'counterstruck' not in headset and all('counterstruck' not in vals for vals in forms.values()):
              forms['counterstrike'].insert(1,'counterstruck'); added.append('counterstruck')
          else:
              skipped.append('counterstruck')
          corrections['counterstrike']={
              'removed':['counterstriked'],
              'added':added,
              'skippedCollision':skipped,
              'kept':[f for f in forms['counterstrike'] if f!='counterstruck']
          }

          # Irregulars/collision-sensitive forms reviewed explicitly.
          assert forms['backslide']==['backslides','backslid','backslidden','backsliding']
          assert forms['hanker']==['hankers','hankered']
          assert forms['mesmerize']==['mesmerizes','mesmerized']

          flat=[]
          for w,vals in forms.items():
              assert w in headset and len(vals)==len(set(vals))
              for f in vals:
                  assert f.isascii() and f.isalpha() and f==f.lower()
                  assert f!=w and f not in prior and f not in headset
                  flat.append(f)
          assert len(flat)==len(set(flat))
          report={
            'batch':45,
            'verbCount':len(forms),
            'reviewedFormCount':len(flat),
            'corrections':corrections,
            'verbForms':forms,
            'formsReviewed':True
          }
          (root/'staging/batch045/REVIEWED_FORMS.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'verbCount':len(forms),'reviewedFormCount':len(flat),'corrections':corrections},indent=2))
          PY
      - name: Commit reviewed forms
        run: |
          git config user.name dictionary-dataset-bot
          git config user.email actions@users.noreply.github.com
          git add staging/batch045/REVIEWED_FORMS.json
          git commit -m 'Review Batch 045 forms'
          git push
